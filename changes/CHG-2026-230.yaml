notes: "Client-only combination. Two things ops 0.1.19 carries, and one finding that came out of trying to prove them in production. FIRST HALF SHIPPED, SECOND HALF FOLLOWED: CHG-2026-228 moved the caller onto its own relay inbox but moved only the receiver it POLLS, leaving the address it ADVERTISES as the old shared literal. The first real call after that roll reached SENT and timed out holding no result, because the signed package was delivered to a mailbox nobody was reading. Both halves are now in ops 0.1.19. The shape is worth keeping: the bug was in neither half, it was in shipping one of them - a private inbox nobody is told about is indistinguishable from a broken network, and it fails later and more confusingly than never having moved. PROVEN ON THE REAL DEVICE: with 0.1.19 the 403 poll loop is gone, a call reaches the responder over the authenticated public relay, the worker executes, and a signed result package comes back to the caller. The transport round trip against production works. ALSO IN THIS RELEASE: the caller skill surface can finally attach a file. The only real hotline on this network declares a required PDF and how to send it, and that surface silently dropped an attachments argument - prepare answered ready and the responder rejected the call for having no input document, so an agent following the published contract exactly could not satisfy it. Attachments are read at prepare rather than dispatch, so a missing file is a preparation error the agent can still fix. They forward as input_artifacts, which the caller controller has accepted since FR-032 and which nothing on this surface had ever sent - the agent-callability e2e uses a text-only hotline, so the attachment path was never covered from the agent side. WHY M3 STILL HAS NO PRODUCTION EVIDENCE, found while attempting the replay: a device that both HOSTS and CALLS the same hotline resolves it with source 'local', so the prepared record's `remote` flag is false and dispatch takes the local branch. That branch issues no task token, fetches no delivery metadata and uploads no input artifacts - so the PDF is dropped, and more importantly the call never touches the platform at all. No delivery grading, no acceptance window, no settlement. M3 units 1-4 cannot be exercised from a device that serves the hotline it calls. Reproduced twice (req_8a7af1af and req_4b8805c3). The open question is a design one and is deliberately not decided here: whether a hotline published on the platform should be called through the platform even when this device happens to serve it. 'I also run this' is not the same claim as 'this is a local-only hotline', and review_status local_only already exists to mark the second."
