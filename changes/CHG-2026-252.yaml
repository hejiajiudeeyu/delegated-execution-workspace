notes: "Production rolled to v0.4.19-ops.0.1.25 (owner authorised in session, 2026-08-18). A separate bundle rather than an edit to CHG-2026-251 because that one is frozen passed/passed and the validator forbids rewriting it. STACK: IMAGE_TAG v0.4.18 -> v0.4.19 in the public-stack .env on aliyun-ecs (previous .env kept as .env.bak.<ts>; rollback is that one line plus a compose up), then compose up with the nginx override. Images were pulled BEFORE the tag was switched, which earned its keep immediately: rsp-gateway failed the first pull with a GHCR blob EOF — the image_pull_failed class the release process documents — and had the tag already been switched the gateway would have been down while it was retried. It succeeded on retry. All three components then reported release_id=v0.4.19 at git 90ad5cfe8415, and `release-manifest check https://callanything.xyz` reports **runtime matches release v0.4.19-ops.0.1.25**. DEVICE: upgraded to @delexec/ops 0.1.25 and restarted clean, no sqlite ABI trouble. THE RENEWAL PATH WAS PROVEN, NOT ASSUMED: the device was deliberately given back the receiver token that actually expired on 2026-08-16 — recovered from ops.config.json.bak.20260810T151824, the same credential that caused the outage — and started. The supervisor renewed it through the new platform route at boot and persisted the replacement (expires 2026-08-25T09:38:08Z), with **zero 401s**: it never reached the failure path at all, because the startup check renews ahead of expiry rather than waiting to be refused. No SSH anywhere in that recovery, which is the acceptance condition issues/0002 set. The platform now records relay_credential_expires_at for this device, so from here on an expiry it issued is one it can also see. VERIFIED BY CALLING: req_7b9f7ed0-fa61-4012-9c2d-dfc4b7ddd4e1 on the rolled stack via the agent surface, delivered and delivery_integrity=verified inside 30s, accepted through accept_delivery, four axes delivered/verified/accepted/none, 5 artifacts (pages 0-2 of demo1.pdf). STILL OPEN: issues/0002 items 4 and 5 (expiry pre-warning in attention, delexec-ops doctor surfacing this). The 7-day default TTL is now safe because renewal is automatic and runs 24h ahead, but a device that stays off for longer than its credential lives still comes back through the in-flight 401 path rather than the startup one — slower, and correct."
