notes: "Started from an owner question — should production and development be isolated — and from an owner authorization to operate production directly using the admin key read from its .env (used in-session only; never written to any repo file, commit or bundle). WHAT THE QUESTION TURNED UP: production's public catalogue held 4 hotlines, 3 of them June/July rehearsal leftovers still `enabled` and offline for one to two months; the attention feed held 12 items, 11 of them debris (7 stuck rehearsal calls, 4 devices whose machines are gone); and this development machine has 10 ~/.delexec* directories, the default one pointing at 127.0.0.1 with test hotlines like cli.invalid.guidance.v1 in it. THE STRUCTURAL FINDING, which is the important one: NEITHER kind of attention item could be cleared by ANY operator action. A call leaves `call_stuck` only by reaching a terminal execution state, and the only producers were the device itself and a signed reconciliation report — neither is coming from a machine that no longer exists. `device_unavailable` counts any responder still holding a hotline, and disabling the hotline does not change what the responder holds (measured: disabling all three debris hotlines moved the count 12 -> 12). Since FR-066 alerting reuses buildAttentionItems(), turning alerting on would have paged every six hours, forever, about calls nobody could close. CHG-2026-197's promise — silence after an alert means resolved — would have been false for every item, not just these. PLATFORM (v0.4.9): POST /v1/admin/requests/:id/close ends an abandoned call; a reason is required, because a judgement with no stated reason is the unauditable operator action NFR-S05 exists to stop. It NEVER settles — like the reconciliation endpoint it can only refund, since an operator ending an abandoned call is not evidence that anything was delivered; a settlement that already happened is left alone and reported (`left_as_settled`) rather than quietly reversed, which would be the operator inventing an acceptance decision that never took place. POST /v2/admin/responders/:id/retire withdraws a gone device's claim to serve: hotlines disabled, hotline list cleared, record kept. CANCELED joins the execution projection. 11 new integration cases; platform 59 unit + 152 integration green. PRODUCTION, executed with owner authorization: rolled v0.4.8 -> v0.4.9 (`runtime matches release v0.4.9`); 3 rehearsal hotlines disabled; 7 abandoned calls closed with reasons written to the audit trail (2 refunded a hold that had sat for two months, 3 left as settled and said so, 2 already refunded); 4 rehearsal devices retired. **Attention feed 12 -> 1, and the remaining item is true**: the real MinerU device is genuinely offline. The alerting baseline is now clean, so the webhook URL can be filled in without the first page being about June. ISOLATION: docs/runbooks/production-development-separation.md records the rules — development never points at callanything.xyz, the production device uses a dedicated non-default DELEXEC_HOME (the default one currently holds test hotlines, so a wrong env var is all that stands between them), rehearsal artefacts get retired when the rehearsal ends, and the attention feed is cleaned BEFORE alerting is switched on. Only operational separation was done; the structural kind — a real Network object, which is why FR-001 is still partial — is not, and until it exists the separation rests on discipline, which fatigue beats."
