notes: "M1 delivery unit 5 (A-03, FR-035, NFR-R02). Before this, a responder process that died mid-execution left the call in `held` forever: hydrateResponderState resets activeTaskIds to empty, so the task came back as a row nobody would ever finish, and no path existed to produce a terminal event or a refund. CHG-2026-189's attention feed could see those calls; seeing them was all anyone could do. Client (f9a8c86): attempts are journaled append-only in sqlite with the append-only property enforced by triggers rather than convention, synchronous=FULL because a journal that loses its tail on power loss cannot answer the question it exists for; each process gets a boot_id deliberately not restored by hydrate, each attempt an attempt_id. On boot, reconcileInterruptedAttempts finds started-but-never-closed attempts excluding the current boot's own in-flight work and decides by recoverability class: only an explicitly `restartable` version is re-run (and only if a task record survived), everything else is reported as a signed terminal `failed`. Reporting failed for work that may have completed is the deliberate asymmetry — the responder cannot prove a delivery it never observed, and the caller must not pay for a result nobody can produce. An unreachable platform leaves the attempt open on purpose, because journaling it closed would mean a restart during an outage silently erases the call from both sides. Platform (2fada76): POST /v1/requests/:id/reconcile, Ed25519-verified against the responder's registered keys including rotated-away ones. Cannot settle, enforced twice — `observed_execution: delivered` is rejected 409 RECONCILIATION_CANNOT_CLAIM_DELIVERY, and the billing call is hardcoded to the FAILED path so a report past the first guard still could not produce a debit. Idempotent per attempt_id with the billing store's `state === held` check as the structural backstop. A reconciliation arriving after a normal terminal is recorded for audit and changes no money. Protocol (5b1acd0): documents the endpoint in the platform-api spec, both language files; contracts unchanged at 0.1.4 (validateReconciliationReport was already frozen there), so no republish. Also removed the hand-maintained file list from platform's test:integration — the new suite silently did not run under npm test because it was not on the list, the same trap that dropped two files in CHG-2026-181; the vitest config already globs the directory and the list matched it exactly, so coverage is unchanged and the failure mode is gone (integration now 12 files, 96 passed / 2 skipped, up from 86 / 2). Evidence: client 8 unit + 7 integration against a real platform-api, platform 10 integration, protocol 88 unit; client full suite 101 integration / 151 unit, platform e2e 7/7, all five fourth-repo checks green."
