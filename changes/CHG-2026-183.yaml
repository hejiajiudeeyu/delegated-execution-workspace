notes: "First delivery unit of M1, implementing decision A-02's authenticated relay inbox. platform f26a08b guards the six relay business routes with two bearer credentials: a deployment-held admin token for platform-api and operator tooling, and HMAC-signed receiver tokens scoped to exactly one inbox, minted by an admin-only POST /v1/receivers/:id/tokens. Health and build probes stay public. Send accepts any authenticated party because a Responder must deliver results into the Caller's inbox; forged results remain blocked by the Ed25519 result signature. Polling now claims messages under a visibility lease instead of handing the same envelope to every poller: an ack may carry its lease id, a superseded lease is refused with 409 so a consumer whose lease expired cannot delete work another consumer has claimed, and repeat acks stay idempotent. Memory and sqlite stores share the lease decision, and sqlite lease columns are added in place so an existing relay volume keeps its queued messages. The direct-run entrypoint refuses to start without credentials unless RELAY_ALLOW_UNAUTHENTICATED=1 is explicit; that fail-safe caught four real paths that had been booting the relay bare (the e2e stack, the packaged-service smoke, public-stack compose, and the fourth repo's own source-integration check), and all four now run authenticated rather than opting out. Validating the last one also exposed a genuine bug in the first draft: the supervisor minted a credential even for an external relay, so an operator-provided token was ignored and the caller got 401; it now only mints for the relay it manages and honours TRANSPORT_AUTH_TOKEN otherwise. client 0867e1b+f0706cf teaches the relay-http transport to carry the bearer token on every verb and a lease id on ack, both optional so a local in-process relay keeps working; the token reaches services through ops config runtime.transport.relay_http.auth_token, TRANSPORT_AUTH_TOKEN, or a per-session credential the supervisor generates for its managed local relay, so local development exercises the same authenticated path as a deployment. Evidence: platform unit 43 passed, integration 51 passed / 2 skipped (11 new relay auth and lease cases covering unauthenticated refusal on all six routes, cross-receiver read/delete denial, admin-only minting, lease hiding and expiry, stale-lease 409, ack idempotency, visible-vs-total depth, and sqlite parity), e2e 7/7 green with authentication ON end to end, service-packages smoke green booting the packaged relay authenticated, public-stack compose smoke green with generated credentials, deploy-config and release-docs green; client unit 143 passed including 5 new transport auth cases, client integration 86/86 when run alone. Honest note: the combined client 'npm test' run shows 15 ops-cli/ops-supervisor timeouts on this machine both before and after this change; they are pre-existing local resource-contention flakes, not caused here, and client CI was green on main at c53cf7a. Relay is still withdrawn from the public edge (CHG-2026-181); this change makes it safe to re-expose deliberately, it does not re-expose it."
