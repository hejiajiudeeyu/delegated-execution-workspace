notes: "Second unit of the 2026-08-09 plan, sequenced early because it is small and it removes a half-dead path before the later units touch the transport layer. OWNER DECISION D8.3: freeze the email transport adapters (emailengine / gmail) — mark the configuration surface deprecated, stop the platform emitting `secondary_task_delivery(kind=email)`, keep the code. WHAT THE CODE SHOWED: the platform wrote a second delivery address into EVERY dispatch whose responder had a delivery_email on file, and a grep across all three repos finds that write and NO READER — not in the protocol package, not in the client, not in the platform itself. So the field's only effect was to publish a mailbox address for a private document, down a transport that has never been in a certified combination and has never carried an end-to-end run. That is the definition of a path that looks supported and is not. PLATFORM: `secondary_task_delivery` is now unconditionally null and the SECONDARY_TASK_DELIVERY_CONFIGURED event is gone; the now-unused delivery_email lookup went with them. The new test asserts the primary route and the absent event together, so freezing the second route cannot quietly take the real one with it, and asserts the address does not survive elsewhere in the envelope. CLIENT: configuration keeps working and saving is still accepted — freezing is not deleting, an operator mid-setup should not be blocked, and a deployment already on this transport deserves to be told rather than stopped. What changed is that every surface now ANSWERS the question: `redactTransportConfig` carries a `deprecation` block that is null for supported types (an answer, not an absence), the console marks the option and says why, and the supervisor warns on the way up — once per process, and again if the operator switches onto it later, because by then the start-up warning is long gone. Deployment guide marked frozen in both languages. TESTS: client 162 unit (1 new) + 118 integration (1 existing case extended — the one that already saves an email transport, so the deprecation assertion sits next to the proof that saving still works); platform 59 unit + 154 integration (1 new, red before the change). No npm publish and no production roll: batched with the remaining units, as with CHG-2026-204. NOTE FOR WHOEVER UNFREEZES THIS: the transport packages, their tests (email / emailengine / gmail integration suites, still green) and the client env plumbing are all intact — reversing this is deleting a deprecation block and restoring one object literal."
