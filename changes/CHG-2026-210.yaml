notes: "M2 unit 6 (FR-015), the last of the plan's units except export/import. THE GAP: the catalogue had an operator gate (enabled/disabled), a publication gate (review_status) and an observed heartbeat (availability_status) — but no way to say whether being offline MEANS anything. A laptop responder that sleeps at night and an always-on service that went down looked identical: both 'offline', neither an incident, both dispatchable. DESIGN: `availability_policy: always_on | scheduled | best_effort`, declared at submission, carried forward when a resubmission is silent about it (same absence-preserving discipline as the service terms). Deliberately NOT a frozen-contract field: availability describes the device's operational life, which changes without the promise of the work changing, and no dispute is judged by whether the device was reachable last Tuesday — so no protocol release was needed. THE MERGE THE PLAN ASKED FOR is not of the fields but of the answer: the four state fields stay orthogonal on purpose (the console was burned once by four statuses blurring together — diagnosis-v0.2.0 evidence 6, called out in the plan), and every projection now carries a derived `callable` / `callable_reason` that answers 'can a token be issued right now, and which field says no'. One dispatch gate reads it at token issue — before money is held and before an envelope enters the relay queue. DEFAULT IS BEST_EFFORT, and the load-bearing test pins why: dispatch has never gated on availability, and a stricter default would have made the one real production hotline (offline right now, by design — it is a laptop) refuse tokens without anyone choosing that. Under best_effort an offline device stays dispatchable because the relay queue is the designed path for a device that comes and goes. SEMANTICS: always_on + offline → 503 HOTLINE_UNAVAILABLE (retryable, names the policy and the observed state); the device heartbeating back reopens the gate with no operator action. scheduled is held to its window, evaluated in the schedule's OWN timezone via Intl (a Shanghai evening window matched against UTC clock times is the obvious wrong reading, and there is a test for it); an overnight window's tail belongs to the day it was declared on; a zero-length window means never, not always — '00:00-00:00 means all day' would be a guess about intent; declaring scheduled with no schedule is refused, because it would be a commitment-shaped synonym for best_effort. maintenance blocks dispatch under EVERY policy: it is the one availability state that is a request rather than a measurement — the device explicitly said 'do not route to me', and sticky-maintenance already existed precisely so heartbeat freshness could not override it, yet token issuance had never respected it. ATTENTION: a broken promise (always_on offline, or scheduled offline inside its window) is a new `availability_promise_broken` item that flows to the alert webhook via the existing flattenAttentionToAlerts; the existing device_unavailable item is UNTOUCHED, because the operator cleaned that baseline by hand on 2026-08-09 (CHG-2026-203, 12→1) and a policy default must not quietly reshuffle it. CONSOLE: policy vocabulary on the status badges (承诺常驻/按时段/尽力而为), a policy filter on the hotlines list (the plan's '列表能过滤' acceptance), and red 'not dispatched' reasons (维护中·不派发 / 失约离线·不派发). Admin list gains ?availability_policy= filtering. TESTS: platform 59 unit + 179 integration (10 new — all 10 red on the previous code, verified by stash). NOT DONE: client-side plumbing for a worker to declare its policy via --contract (the field is accepted on both registration endpoints, but ops does not yet forward it — noted for the batch-end ops release or later); schedule-aware alert suppression windows (M3+ if ever needed). No npm publish and no production roll — batched, pre-authorised 2026-08-09."
