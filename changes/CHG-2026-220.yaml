notes: "First delivery unit of M3, opened after M2 was certified on 2026-08-10 (four verification tracks green: local gates, both suites, production matching v0.4.12-ops.0.1.13, four-repo CI). THE PROBLEM, as M3's goal file states it: the party being paid was the only party judging whether the work was done. `schema_valid` was whatever the executor wrote into its own result object; the platform read it nowhere except the review-test harness, and settled money on a bare COMPLETED event the responder posted about itself. CHG-2026-200 wrote down at the time that the check 'has to have somewhere it can fail before it means anything'. This is that somewhere. WHAT LANDED: validateDeliveredOutput (contracts 0.1.10) judges a result against the output_schema of the contract version the Call PINNED, not the catalogue's current value. Both sides run it — the Responder before signing, where a failure can still be described honestly, and the platform afterwards, because 'the Responder says it checked' is the exact class of claim being replaced. Result signatures now cover `hotline_version`: a signed result could say which hotline produced it but never which CONTRACT it claims to satisfy, so a v1 result was cryptographically indistinguishable from a v2 one. THREE ANSWERS, NOT TWO, is the design decision worth keeping. The function reports what it could NOT judge: a contract declaring no output_schema (every hotline approved before the publication gate), a result reporting failure, artifacts that do not say which contract role they fill. Calling any of those valid would be a lie; calling them violations would fail deliveries that are in fact complete. The platform grades verified / failed / unchecked / unverified accordingly and never back-fills a verdict onto a call that predates the check. This matters immediately: M3 unit 2 starts the acceptance clock on the word 'verified', so it has to mean something. THE STRUCTURAL DISCOVERY that shaped the implementation: the platform never received a result package at all. The signed package goes Responder -> relay -> caller; platform-api gets only the terminal lifecycle event. There is no result route and never was. So 'the platform re-checks' is a TRANSPORT change, not a validation call — the signed package now rides the COMPLETED event, size-capped, and an oversized result is graded unchecked rather than rejected (discarding finished work over the size of the envelope announcing it is the mistake CHG-2026-216 already made once). TWO BUGS IN THE DRAFT THIS STARTED FROM, both caught before shipping: it returned valid:true when ajv rejected an output but reported no errors — a silent pass on the one axis this exists to make honest; and its required-artifact check read `artifact.role`, which would have failed the production MinerU hotline on EVERY correct delivery, because result artifacts carry no role and the `role` that exists on artifact DESCRIPTORS is a different vocabulary (input/output/evidence — the direction bytes travel, not the promise they keep). Result artifacts now declare `contract_role`; the MinerU worker declares both of its roles. DELIBERATELY NOT A GATE: a delivery graded `failed` still settles exactly as before. Only the record changes; unit 2 is what makes settlement wait. A test asserts that current behaviour by name so the new axis is not read as enforcement it does not perform. AND THE PROTOCOL SUITE WAS NOT RUNNING ITS OWN TESTS: `test:unit` is an explicit file list, not a glob. Three existing files were being skipped, including hotline-service-terms — the 17 cases the ledger cites as FR-011/FR-012 evidence. They pass and are in the list now; the suite goes 131 -> 165 tests, 19 of them recovered rather than new. A fourth, flow-step-mapping, actually FAILS: it scans tests/e2e/, which does not exist in this repo and never has per git history. Left out pending a decision on where that guarantee now lives — making it skip silently would be the failure mode this codebase keeps naming. TESTS: protocol 165 unit + 1 integration + package check; client 162 unit + 22 responder integration (5 new; the two asserting new behaviour verified red by stashing the implementation); platform 59 unit + 203 integration (9 new, all red before). RELEASE ORDER IS LOAD-BEARING AND WAS FOLLOWED: canonicalization is additive only in the old-signer/new-verifier direction, so contracts published first (run 31328518840, npm latest 0.1.10), then verifiers. A new responder stamping hotline_version against an old verifier would turn every correct delivery into a signature failure. The clean-room CLI tarball test was red by design between the code and the publish, and went green once 0.1.10 was on npm."
