notes: "Usability-sprint unit 3 (decisions.md D7), owner chose full four-volume coverage with a consistency cross-check and authorized rehearsing with a production snapshot pulled to a local machine. THE STARTING STATE WAS WORSE THAN 'NO TOOLING': tools/selfhost-kit.mjs printed a backup checklist covering .env and a postgres dump, which is one of four stateful surfaces. Following it restores a database in which every committed artifact descriptor carries a checksum and points at bytes that were never archived — results that verify and cannot be fetched. This codebase spends real effort making sure a checksum mismatch can never be called delivered (NFR-R03); a backup that drops the bytes tells that same lie one layer down. The console would also come back permanently locked, which is the CHG-2026-194 pain rediscovered from the other side. NEW: repos/platform/scripts/stack-backup.mjs — backup covers postgres (pg_dump, never a volume copy: a live data directory is not safe to archive), artifact bytes, the gateway DELEXEC_HOME credential store, and the relay sqlite (crash-consistent, db + -wal + -shm). verify checks the manifest and per-file sha256, then the check the tool exists for: every artifact the database calls committed must have bytes, of the recorded size, hashing to the recorded checksum; orphan bytes warn rather than block. verify --deep loads the dump into a throwaway postgres and re-derives the artifact index from it, then compares it against the manifest — presence and checksums only prove the bytes survived the trip, and nothing else can tell you postgres will accept the dump or that dump and archives came from the same state. restore refuses to write into volumes holding data and names the one that stopped it. --docker prefixes every invocation so a remote host needs no code deployed (first version failed here: arguments cross a remote shell, and '{{json .Config.Env}}' split on the space; quoting is now centralised). .env is deliberately excluded — five secrets, and backups get copied around — and the guide states what that costs at restore time instead of leaving it to be found during an incident. FOURTH REPO: selfhost-kit's public-stack backup-plan/restore-plan now point at the real tool rather than keeping a smaller, wrong procedure beside it; backup-validate recognises a manifest and says out loud that presence is not restorability; other profiles keep their checklist but now name what it does not cover. backups/ added to .gitignore in both repos — a backup carries API keys and the encrypted credential store. REHEARSAL (real production data, owner-authorised): v0.4.5 snapshot taken over SSH (postgres.sql.gz 19535B, artifacts.tar.gz 668422B, gateway.tar.gz 893B, relay.tar.gz 4371B, 6/6 artifacts committed), verify --deep green, restored into a fresh local project with a FRESHLY GENERATED .env — the worst realistic case. All six artifacts, including both real MinerU runs' inputs and outputs, were fetched back through the restored platform with matching size and sha256; /platform/buildz reported v0.4.5 git_sha a224c17; the attention feed rendered real production content; the console reported configured/locked rather than setup_required, which is how you tell the credential store survived; a second restore into the now-populated project was correctly refused. Torn down with down -v afterwards. DEFECT FOUND AND FIXED BY THE REHEARSAL: the restored stack answered 401 to the admin key in the .env it was started with. hydratePlatformState replaces the whole apiKeys map with the snapshot's, and PLATFORM_ADMIN_API_KEY is seeded before that, so only the key baked in when the database was first empty ever authenticated. The restore consequence is bad; the other consequence is worse and had been live far longer — rotating PLATFORM_ADMIN_API_KEY was a no-op that looked like it worked, and the old key kept authenticating forever. Rotation means revocation, and this had never revoked anything. A stated key now wins over the snapshot and revokes the previous platform_admin entry; an unstated key still changes nothing, because the fallback is random per boot and would otherwise revoke the working key on every restart. Tests: platform 59 unit (9 new pinning that missing, short or mis-hashed artifact bytes BLOCK, and 5 on the admin key, one of them authenticating over real HTTP) + 123 integration green; workspace selfhost-kit gains public-stack plan cases with a negative control. NOT DONE, on purpose: off-site and scheduled backups — this is 'run one command', not 'runs daily and lands somewhere else', and a backup on the same host does not survive losing the host; E7's Responder and Research rehearsals; relay envelope-count assertions after restore. STILL PENDING FROM CHG-2026-198: the owner has not yet saved a webhook URL or the liveness ping URL in the production console, so production remains at zero outbound alerting from an operator's point of view."
