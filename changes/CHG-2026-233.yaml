notes: "M3 unit 6, first half: the execution budget. THE PROBLEM IT CLOSES, in the words of the production incident that found it: three clocks ran every call and none of them knew about the others - the caller's own hard timeout, the platform's task-token TTL (which doubled as the billing hold's expiry) and the responder's per-hotline limit. All three defaulted to about five minutes. A real MinerU parse with a cold model takes about four, so the first real production call on 2026-08-09 died on whichever fired first, and raising any one of them would only have changed which error came back. PROTOCOL: a hotline declares `execution_budget_s` and everyone derives from it. Tier defaults are sized for what each tier is for rather than for what a request/response API assumes - quick work is interactive (5m), deep work is the kind you go away from (4h), standard sits between (30m). Out-of-bounds is REFUSED rather than clamped, the same rule the acceptance window follows and for the same reason: a budget quietly moved is a promise quietly changed, and the publisher should learn it at publication rather than when work is killed mid-execution. It joins HOTLINE_VERSION_CONTRACT_FIELDS, so it snapshots into a Call; the default resolves on read and is NEVER written onto a stored version, because writing it would move the content digest and every Call bound to that version would start reporting digest_mismatch. Same trap as service_tier, same line, with a test that pins it. PLATFORM: the split between token TTL and execution budget already existed - it was made when that first production call was refunded and synthesised into a FAILED while still executing. What did not exist was a budget belonging to the CALL: one global number decided how long every hotline's work could take, whatever it did. The Call's frozen execution_budget_s now wins, so a hotline re-tiered mid-flight cannot shorten a running call and a four-hour job is not judged by a number chosen for a five-minute one. The global remains the answer for calls made before the contract could say, unchanged in value. TESTS: protocol 176 unit (4 new, including the digest-stability one); platform 59 unit + 236 integration. M2 exit harness 27/27. NOT DONE IN THIS BUNDLE: the other half of unit 6 - QUEUED and EXECUTION_STARTED as real lifecycle events, so the platform can tell a task waiting behind another on a busy device from one actually running. The protocol has had those states and their transition table since M1 and they are now covered by tests, but nothing emits or projects them yet. Also unreleased: contracts 0.1.10 is still what npm has, and production runs v0.4.16."
