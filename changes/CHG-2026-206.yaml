notes: "M2 units 4 and 5 shipped as one protocol batch (FR-011, FR-012, owner decision D8.2), so `@delexec/contracts` releases once rather than twice and the lockfile chase happens once. THE GAP: three questions the protocol could not ask at all. How long the caller has to accept (tier). Whether the work runs supervised or sealed. Whether a machine may call the hotline unattended. The third is why `prepare_request` answered `review: not_required` with a hardcoded literal for every hotline in existence — there was nothing to read. PROTOCOL (contracts 0.1.9, publish run 31299739306, owner-authorised by multiple choice on 2026-08-09): SERVICE_TIER quick/standard/deep with A-05's acceptance windows (24h/72h/7d, network bounds 24h-7d), PRIVACY_MODE, FULFILLMENT_MODE auto|confirm, four resolvers and `serviceTermsOf`, all folded into the publication gate. `sealed` is NAMED even though nothing can run it, and declaring it is REFUSED rather than downgraded: accepting the declaration and then executing supervised would tell a publisher their data was isolated when it was not, which is the one failure here that must never be quiet — and a mode this deployment cannot honour reports differently from a mode that does not exist, so the publisher learns which mistake they made. An out-of-bounds acceptance window is refused rather than clamped, because a window quietly moved is a promise quietly changed. All three fields are optional and every default resolves on READ: the gate does not re-validate an already-approved hotline, so a new required field would split the catalogue into records that can be re-published and records that cannot, with nobody choosing that. 18 unit cases; defaults documented as PROVISIONAL rather than FROZEN because they are A-05's provisional numbers. PLATFORM: submission accepts and carries the terms, the gate refuses the bad ones, and the Call snapshots them at the instant it pins the version, from the version's own contract. Derivable from the pin — but M3 must read them to run an acceptance clock, and a value that has to be looked up is one that will eventually be looked up in the CATALOGUE, which is precisely the 'judged against what the contract says now' failure the pin exists to prevent. The load-bearing test republishes the hotline under new terms and asserts the in-flight Call did not move. THE TRAP THIS ROUND AVOIDED: writing defaults into stored records. These fields are part of the frozen contract, so materializing `fulfillment_mode: auto` onto existing catalogue rows would change the content digest of records nobody edited, and every Call already bound to one would start reporting digest_mismatch. Storage preserves absence; reads resolve it. Asserted on both sides. CONSOLE (rolls in the standing 'blind approval' side item): the review queue showed a name, an id and a price — approving was a signature on a document nobody had read. It now renders required/optional input fields, the output shape, what the hotline says it is NOT for, the worked examples and the service terms, all from fields the list response already carried; zero new endpoints. Missing pieces are labelled as things the publication gate will refuse, rather than left to be discovered by clicking approve. Rejection now requires a reason (the diagnosis line-C item): without one the publisher has nothing to act on and the audit trail has nothing to explain. TESTS: protocol 128 unit + 1 packaging; platform 59 unit + 162 integration (8 new). LOCKFILE: platform-api floor bumped to ^0.1.9 with `npm update --package-lock-only`, per the 2026-08-05 trap — the local @delexec/contracts is a hand-made symlink to protocol source, so drift is invisible locally and only appears as an ESM export error in CI or the image smoke. NOT DONE HERE: the acceptance window enforces nothing until M3, by design — this round only makes it sayable and freezes it. `prepare_request` still hardcodes the review slot; deriving it from fulfillment_mode is unit 9, which this unlocks. No production roll yet: batched to the end of units 4-11, for which the owner pre-authorised the ops npm publish and the production roll on 2026-08-09."
