notes: "M3 unit 5, and the owner-authorised change it required: the ledger hold moves off token issue and onto acceptance. WHY IT HAD TO MOVE, rather than growing a compensating refund: the protocol has said since M1 that a REJECTED call holds no funds and moves none - not 'is refunded', never held (call-state.js validateCallState). Hold-then-refund is therefore not merely wasteful but unrepresentable; there is no legal state in which a rejected call carries a refund on its ledger. Consent and balance are still CHECKED at token issue, because a caller should learn it cannot afford a call when it asks rather than minutes later from a device. The check is now advisory: nothing is reserved until the responder has the work. That is the cost the owner accepted when authorising this option - insufficient funds surface later, and there is a window between asking and acceptance in which nothing is reserved. The hold lands at the first sign the responder took the task on, and ACKED counts as well as an explicit decision. That is what lets already-deployed responders keep working: one that predates this says only ACKED, and it means the same thing. Anchoring on 'took it on' rather than on one event name is the compatibility seam. REJECTED touches billing not at all, asserted as an absence - no BILLING_HELD, no BILLING_REFUNDED, balance untouched. NOT /accept, and the collision was not theoretical. The caller's acceptance and the responder's are different acts sharing an English word: the caller accepts a DELIVERY, the responder accepts a JOB. They sit on different axes at opposite ends of the call, and one releases money while the other reserves it. The first implementation shared the path and the caller route answered first, 403ing the responder. The responder's decision is now POST /v1/requests/:id/execution with an explicit decision field, so the meaning never depends on who is holding the credential. SIX EXISTING TESTS CHANGED because they encoded hold-at-issue - each now acknowledges before asserting a hold, which is what their scenarios always meant, and the expired-hold test's event sequence gains ACKED before BILLING_HELD. TESTS: platform 59 unit + 235 integration (6 new); M2 exit harness 27/27. NOT DONE: the client does not yet call the new route, so a responder still triggers the hold via ACKED; and this is unreleased - production runs v0.4.16."
