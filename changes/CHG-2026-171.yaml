notes: "Platform-only change on top of CHG-2026-170. Gateway adds bootstrap-secret guarded POST /session/recover (destructive store replacement via replaceSecretStore; requires confirm_reset; clears sessions; admin key must be re-entered). Served vanilla console (index.html -> src/main.js — NOT the unserved React app) reworked: state-driven session panel (setup/locked/unlocked/unreachable) from new session-view.js, browser recovery flow typing RESET, admin-credential next-step guidance, network-failure and loading states, gateway health card on overview, review lifecycle + billing tenant_id=user_id explainability, review queue nav prioritized. Operator guide documents lost-passphrase recovery. Platform validation 2026-07-04: test:unit 33 passed (incl. new session-view tests), test:integration 15 passed/2 skipped (billing-store skip pre-existing), test:service:packages, test:deploy:config, test:release:docs all passed; live gateway smoke of setup->credential->recover->relogin passed. Fourth-repo check:submodules, check:boundaries, check:bundles, test:contracts, test:integration all passed 2026-07-04 (integration required corepack->pnpm shim + better-sqlite3 Node-26 ABI rebuild). Closes the T-503 SSH-recovery violation path; production rollout and T-503 zero-violation rerun remain follow-up release activities (needs new gateway image tag)."
