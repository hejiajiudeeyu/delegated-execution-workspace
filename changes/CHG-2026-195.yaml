notes: "Reported as a test hygiene problem — the ops CLI integration tests leak child processes — but the root cause was in the runtime, not the tests. `delexec-ops start` had no signal handling at all: caller, responder, caller-skill-adapter and caller-skill-mcp-adapter are plain children of the supervisor, so signalling the supervisor alone killed only the supervisor and left all four reparented to init with their ports still held. Verified against the unpatched code before changing anything: one SIGTERM to the supervisor pid left 4 survivors and 4 held ports. Downstream cost was the release gate — tools/source-integration-check.test.mjs asserts the integration ports are closed and failed with 'found open: 8091, 8092' after any client test run, which reads like a regression when it is only a leaked process. The 2026-08-02 workaround was `pkill -f delexec-ops-clean-room`; deliberately not adopted, since it hides the leak instead of fixing it. Three gaps, each confirmed against a baseline. (1) commandStart now installs SIGTERM/SIGINT/SIGHUP handlers that stop the managed services before exiting, wired up BEFORE the services start — bringing them all up takes seconds and a signal landing inside that window still orphaned whatever was already running. That startup race was not in the original report; the new regression test found it. (2) stopProcessInfo escalates SIGTERM to SIGKILL rather than silently abandoning a child after 3s, and stopManagedServices drains in-flight launches behind a runtime.stopping fence so a shutdown racing startup cannot spawn into a dying supervisor; the fence lifts again by default so the existing stop/start restart and transport-switch paths keep working, and only the CLI's terminal shutdown passes final:true. (3) a shared process-exit sweep covers paths no `finally` reaches — this is how an embedding test runner orphaned children when a worker died, observed live when a caller-controller crashed on EADDRINUSE and took the vitest worker with it. Tests: the clean-room case now tracks the supervisor that `bootstrap` starts and tears it down, afterEach waits for tracked processes to actually exit before removing their directories, and both paths assert the ports came back rather than trusting teardown. A new case signals the supervisor pid alone — deliberately NOT its process group — so it still fails against a CLI that ignores signals. Verification: client npm test 151 unit + 110 integration passed, then lsof on 8091/8092 returns nothing and no stray processes remain; the previously failing tools/source-integration-check.test.mjs now passes right after a full client run. Cross-repo: contracts ok, source-integration ok. Note the source-integration run failed once first on a transient TLS disconnect while fetching the better-sqlite3 prebuild inside the platform Docker build (falling back to node-gyp, which has no Python in that image) and passed clean on retry — environmental, unrelated to this change, which touches only client ops sources. Known leftover, not addressed here: reserveFreePorts has a TOCTOU (bind :0, close, hand out) and the service crashes hard on a listen error, which is what produced that EADDRINUSE. The new exit sweep contains the consequence — a crashing worker no longer orphans children — but the flake itself remains and did not recur across three subsequent full runs."
