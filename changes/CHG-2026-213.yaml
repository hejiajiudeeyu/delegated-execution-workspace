notes: "Owner's call, and it came from the right question: asked whether the agent could do the MinerU re-registration, and observing that if a responder agent CANNOT complete its own hotline registration then the onboarding is under-guided. Investigating that produced a defect rather than a documentation gap. THE DEFECT: `submitCatalogHotline` set `status:disabled, review_status:pending` UNCONDITIONALLY on every resubmission — including one whose declaration had not changed by a single byte. That is the actual reason M2 unit 3's production closeout had to be done 'in one sitting': re-registering the device disables the only working hotline, re-approval needs an operator credential that lives in the owner's console session, and the interval between them is an outage of unknown length. It is also precisely why the half a device could do autonomously was the half that causes the outage — so the correct move at the time was to do neither, and the underlying bug went unnamed. THE FIX, using machinery that already existed: approval has been content-idempotent by digest since CHG-2026-200; submission now reaches the same conclusion from the same digest. If the declaration hashes to the published version's digest, there is nothing to re-review. The comparison is deliberately WIDER than the digest, because a contract can be identical while the thing serving it is not — a rotated `responder_public_key_pem` (the key that verifies every result this hotline produces, and the one substitution an operator must be shown), a redirected `task_delivery_address`, or a different `responder_id` all re-enter review. So does a hotline approved before contract versioning existed: with no `published_version_digest` there is nothing to compare, and the safe direction is re-review — which is production's own hotline today, so this change does NOT quietly grandfather it. And a hotline an operator disabled on purpose is not resurrected by the device happening to re-register. TWO CONSEQUENCES WORTH NAMING: an unchanged resubmission does not bump `submission_version`, because it rides in billing claims as `pricing_hint_version` and bumping it would invalidate consent a caller had already given for a price that did not change; and it files no review event, because asking the operator to re-approve what they already approved is the same interruption in a different place. The response carries `resubmission_unchanged` plainly — 'nothing happened' and 'it worked' are indistinguishable from a device's side otherwise, and a device that cannot tell them apart resubmits forever. CLIENT: `delexec-ops responder contract-check` closes the other half of the guidance gap. The platform can report `contract_declared:false` indefinitely while the device serving that hotline has no way to learn it — nothing pushes it down, nothing polls for it, and the operator finds out by reading the public catalogue by hand, which is how production spent weeks advertising a PDF parser as a text summarizer (CHG-2026-202). The command asks each worker what it declares via `--contract`, asks the platform what it published (uncredentialed, so it runs on a machine holding no credential yet), and names the state of each hotline — including the two that are nobody's fault but still need saying: a worker with no `--contract` support, and an unreachable platform. Every gap prints the command that closes it. Read-only. TOGETHER these turn the standing owner action from 'you must do registration and approval in one sitting, and the hotline is down in between' into 'the device resubmits on its own and stays live; only a contract that really changed waits for approval'. TESTS: platform 59 unit + 190 integration (7 new, all red on the previous code, verified by stash); client 162 unit + 127 integration (1 new). STILL NOT DONE BY ME, AND STILL NOT MINE TO DO: the production MinerU device's ops home is not on this machine — every `.delexec*` home and every `ops.config.json` within four levels of the home directory points at `http://127.0.0.1:8080` local dev, none carries `mineru_mac_msanqn8p`. So the re-registration still needs running on whichever machine holds that device; what changed is that it no longer has to be paired with an immediate approval. Not released: no npm publish and no production roll — the batch pre-authorisation was used up by CHG-2026-212."
