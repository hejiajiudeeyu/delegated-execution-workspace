notes: "The fourth repo's CI had failed 59 of its last 60 runs, back to 2026-06-14, and reported the same word every time: `timeout`. Owner noticed. The word was wrong. WHAT IT ACTUALLY WAS: `@delexec/responder-runtime-core` imports `@delexec/runtime-utils` and never declared it. This repo installs with npm workspaces, which hoists everything into one flat node_modules at the repo root, so Node walks up from the importing package and finds a copy belonging to somebody else — the import resolves locally by accident of layout. The fourth repo installs with pnpm, whose layout gives a package only what it declared, so the responder died at boot on ERR_MODULE_NOT_FOUND. THE LOCAL GREEN WAS THE LIE, NOT THE REMOTE RED — and the same undeclared import would break a clean-room install of the published tarball, so this was never CI-only. Owner asked directly whether CI itself might be wrong; the evidence says no, and the check that now enforces it needs no install to prove the point. WHY IT SAID `timeout` INSTEAD: two waits whose success and failure are indistinguishable to their caller. `waitForServiceHealth` returned a bare `null` on failure and every caller ignored it, so `managed_services_started` fired eight seconds after the responder exited 1; the call the check then made had nobody to answer it and gave up sixty seconds later. And `waitForRelay` was worse in the same family — it returned `undefined` on BOTH paths, which is why the first code to actually read its result reported every healthy relay as a failure and had to be fixed in the same round. A wait that cannot be distinguished from its own failure can only be used by ignoring it, which is exactly how both survived. THREE FIXES: (1) the missing declaration, plus `check:declared-workspace-deps` — reads what each package imports, compares against what it declares, needs no install, runs in `npm test`, and against the pre-fix tree names exactly this package; (2) `ensureBaseServices` returns which services are serving, `managed_services_started` carries `unhealthy`, a non-serving service emits `service_start_failed` with the tail of its own log (the service knows why it died and nothing else does), and a health wait stops early once the process has exited. The reporting lives in the startup helper rather than inside one wait function, because the relay uses a different wait and a diagnostic that depends on which wait a service happens to use goes missing for exactly one service; (3) bootstrap checks the runtime before spending the call timeout, so a dead service reads as `responder exited with code 1` instead of sixty seconds of nothing. AND THE REASON TWO MONTHS OF RED TAUGHT NOBODY ANYTHING: the integration check's ops home — which holds every service log — is a temp directory its `finally` block deletes, so no run ever printed a diagnostic. It now dumps every service log, the relay output, `docker compose ps`, platform-api logs and the listening ports before cleanup. One CI run with that in place produced the root cause. A red signal that never explains itself is worse than no signal: it trains everyone to stop looking, which is what happened for two months, including to me — I reported 'five checks green' all through the M2 batch on the strength of local runs and never opened the CI tab. Every one of those bundles was locally verified and remotely red. VERIFIED: run 31314203948, all six jobs green (submodule-integrity, workspace-install, nx-graph-and-affected, source-integration-check, change-bundle-validate, contracts-check). Client 162 unit + 128 integration. Not released: no npm publish, no production roll."
