notes: "Second delivery unit of M3. Unit 1 (CHG-2026-220) gave a delivery an objective verdict; this gives the caller a position from which to act on it. Until now the responder posting COMPLETED both ended the work and released the money in the same request — the paid party decided when it got paid. NO PROTOCOL RELEASE WAS NEEDED, which is worth recording because the plan assumed one: the acceptance axis, its statuses and its transitions were all frozen in M1 (`call-state.js` ACCEPTANCE_STATUS / ACCEPTANCE_TRANSITIONS), and the platform's own request-event names are local vocabulary rather than CALL_EVENT values. So unit 2 is platform + client only, and contracts stays at 0.1.10. WHAT LANDED: settlement is split off from execution. FAILED still refunds immediately — nobody should have to accept a failure to get their money back — while COMPLETED only opens an acceptance window. Exactly two things settle: `POST /v1/requests/:id/accept` from the owning caller, and a window that expired. The pre-existing `billing.state === 'held'` guard now carries the exactly-once weight for a new race (an explicit accept against the expiry sweep), asserted directly. A-05'S CLOCK STARTS AT VERIFIED DELIVERY, NOT COMPLETED, and the distinction is the unit: COMPLETED is the paid party's own claim, so starting the caller's clock on it would let the responder decide when the caller's right to object begins. The window length is read from the service terms frozen into the Call at token issue and never from today's catalogue — a provider editing their acceptance window must not shorten a window already running; there is a test that the deadline is derived from the snapshot. Auto-accept follows this service's existing shape for time (lazy evaluation on reads, beside the hold expiry) because there is no scheduler and a per-call timer would not survive a restart. THE DECISION THIS UNIT MADE ON ITS OWN, flagged for the owner rather than buried: a delivery the platform graded `failed` is NOT auto-accepted when its window expires. Silence is a fair way to say 'fine' about work that met its contract; it is not a fair way to pay for work the platform itself established did not. Those calls keep their funds held and surface to the operator, who has had a close-with-refund route since v0.4.9, so nothing is stranded without recourse while the caller-side dispute flow is still unit 3. THE ATTENTION FEED HAD TO LEARN THE DIFFERENCE: a held budget on a delivered call used to mean money nobody noticed and is now the normal state for up to seven days. Left alone, `funds_held_after_end` would have paged the operator every renotify period about calls behaving correctly — an alert that fires for correct behaviour is how an operator learns to ignore the feed. CLIENT HALF: the caller-skill adapter gains `accept_delivery`, because an acceptance only performable from an operator shell is not an acceptance the caller has. It is also the first platform call this adapter makes as somebody — every read it did before was against the unauthenticated public catalogue — so it sends the caller's own credential and refuses with a named error rather than an anonymous 401 when it has none. THREE EXISTING TESTS CHANGED, each rewritten to assert the property it was actually guarding rather than deleted: money moves once however many times delivery is reported (now driven through acceptance); a hold becomes a debit when the caller accepts; and a late reconciliation cannot re-price a call — that last one got STRONGER, because a delivered call now sits held for days and reconciliation forces FAILED, so it asserts a late report cannot reach into the acceptance window and undo a verified delivery. TESTS: platform 59 unit + 214 integration (11 new); client 162 unit + 138 integration. The M2 exit harness `tools/agent-callability-e2e.mjs` is updated in the same bundle rather than left to break, and grew from 24 to 27 assertions: delivery alone does not release the budget (asserted as the full authorized 200 still being held rather than the 120 the work cost, so it cannot pass on a state label alone), the agent accepts through its own surface holding nothing but caller credentials, and only then the money moves. NOT RELEASED: no image, no npm publish, no production roll — platform main also carries the unreleased console fix from earlier today."
