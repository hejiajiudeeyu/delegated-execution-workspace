notes: "The last piece of M3's exit criteria, and three bugs the attempt to get it uncovered. WHY IT WAS MISSING: hold-to-accept-to-settle was proven only by tools/settlement-lifecycle-e2e.mjs, because the network's one real hotline (MinerU) declares no price, so its calls were honestly reported as unbilled and no coin had ever moved in production. Owner authorised deploying a priced hotline. WHAT WAS DEPLOYED: local.echo.priced.v1, 20 PTS a call, a deterministic echo worker \u2014 its purpose is MONEY evidence rather than work evidence, so a four-minute model load is not in the way. Production billing is enforced. Approved through the operator surface; a billing tenant created and recharged for the device's caller. THE RUN (req_cd22fb3b-bec8-4600-9722-4f89f771ee75), agent-side throughout and holding only caller credentials: an unconsented call is refused AND THE REFUSAL CARRIES THE PRICE (BILLING_CONSENT_REQUIRED with pricing_hint, so an agent does not have to guess what to agree to); explicit max_charge_cents 50; delivered. AFTER DELIVERY: delivery_integrity verified \u2014 the first time FR-040's verdict has been read directly in production \u2014 acceptance pending on a 72h window, settlement HELD, balance 1000 -> 950. The hold is the authorized ceiling of 50, not the 20 the work cost, and the responder reporting COMPLETED released nothing. Then accept through the caller's own surface: balance 980. Ledger for the call is exactly three rows \u2014 hold -50, refund +30 (the unused part of the ceiling), debit 0 (the accounting marker). Exactly the price, exactly once. THREE 'DECLARED UPSTREAM, DROPPED DOWNSTREAM' BUGS THE DEPLOYMENT FOUND, fixed in CHG-2026-240 and the fourth and fifth instances of that shape in this project: (1) the skill adapter's own catalogue projection listed eleven fields and dropped submission_version and trust_tier, which are exactly what a price consent has to name; (2) resolveCatalogTarget asks the local supervisor first, and the local copy of a hotline this device happens to serve carries no platform-side facts at all \u2014 so EVERY paid call through the agent surface was refused against a real deployment, and the local e2e could not have shown it because its hotline is created fresh on the platform; (3) the worker declared service_tier: quick and the published record said standard, because two explicit field lists \u2014 one building the profile from the worker's contract, one carrying it into the submission \u2014 predated the service-terms fields. A tier chooses the acceptance window a caller gets and the budget the platform judges the work by, so the publisher's declaration silently became somebody else's defaults. ONE HONEST NOTE: the recharge was applied twice (500 + 500) because the first response was misread as a failure. Internal quota, no harm, recorded because the record should say what happened. TESTS: client 169 unit + 142 integration, including a regression that the consent fields survive the projection and that undeclared service terms stay ABSENT rather than defaulting \u2014 writing a default would change the content digest of a declaration nobody made. NOT RELEASED: these client fixes are unpublished; production runs v0.4.18 with @delexec/ops 0.1.21, and the evidence above was produced by running the device from repository source."
