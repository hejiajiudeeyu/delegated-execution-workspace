notes: "M2 unit 10, brought forward ahead of unit 6 because it sits on the plan's own exit-criterion chain (discover -> read -> fill -> consent to pay -> confirm -> completion webhook) and unit 6 does not; getting that chain runnable earlier means the batch-end release has real evidence behind it. THE CLI HALF, as the plan described it: `billing.acknowledged = true` was set unconditionally and `max_charge_cents` defaulted to 500 when the operator named none — so 'the caller agreed to pay, up to this much' was a sentence the client wrote on the operator's behalf, about a number they had never been shown. The CLI now reads the price from `/v2/hotlines/:id` (uncredentialed, so the read happens before committing to anything) and refuses a paid hotline with no `--max-charge-cents`, quoting the price. An explicit ceiling is still honoured when the price cannot be read: the hotline may not be in the public catalogue, and discarding a real consent because the lookup failed would be its own bug. THE MCP HALF, which was bigger than the plan's anchor suggested: the path could not express consent because `send_request` NEVER ISSUED A TASK TOKEN. It ran the local create/contract-draft/dispatch sequence for every hotline, so a platform hotline got no token, no delivery metadata and no billing — paid or free. That is the real reason a paid hotline was 'uncallable by an agent' rather than merely unauthorized, and it means the MCP path had never completed a platform call at all. Remote hotlines now go through /controller/remote-requests (create -> prepare -> contract draft -> input artifacts -> dispatch, the path the CLI already used); local hotlines keep the sequence they had, asserted by the untouched local test. Consent is settled at PREPARE rather than at send: an agent that learns the price only when dispatch fails has already committed to the call in its own plan, and the prepared request is the artifact a human reviews under `fulfillment_mode: confirm`. `billing` threads through caller-controller-core's issueTaskToken and is omitted entirely when absent, so a free hotline's request is byte-identical to before — asserted on both paths. PLATFORM: three things wrong with how a refusal read. Sending no billing block at all — the commonest way to not consent — reported as a generic ERR_BILLING_REQUEST_INVALID 400, which reads as 'you sent something malformed' rather than 'you have not agreed to pay'; it is now the 402 it always was. None of the refusals carried the price, so a caller told only that it did not consent had to go find out what to, and an agent would have had to guess a number — every billing refusal now carries the pricing_hint. And consent was validated AFTER the billing store was consulted, so a caller that had not consented was told the ledger was down: a missing consent is the caller's problem and fixable by the caller, a store outage is the operator's, and reporting the operator's to a caller who also has its own sends it away to wait for something that will not help. Reordered. TESTS: client 162 unit + 125 integration (4 new: MCP-path refusal carrying the price, ceiling-too-low, consented claim well-formed, and a free hotline unchanged — all against a real platform-api; plus a CLI case proving it will not consent on the operator's behalf and quotes the price when it refuses). Platform 59 + 163 (1 new, and it proves the reordering without a Postgres billing store: under enforcement with no store, no consent gets 402 with the price while well-formed consent gets as far as 503). NOT DONE: a real held-and-settled paid call end to end still needs a Postgres billing store, which this environment does not have; what is proven here is that consent is constructed, transmitted, and validated, not that funds move. No npm publish and no production roll — batched to the end of the units, pre-authorised 2026-08-09."
