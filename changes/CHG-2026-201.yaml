notes: "M2 unit 2. THE AUDIT THAT MOTIVATED IT (production data, read from the 2026-08-06 backup rather than from the ledger): the four demo hotlines carried schemas and examples that pass their own schemas, while local.mineru.pdf.parse.v1 — the ONLY hotline that had ever done real work, the one behind both real cross-device MinerU runs — declared NO input schema, NO output schema, no examples and no limits. It was callable because nothing ever required otherwise. So FR-010's gap was not 'missing scope statements'; it was that a hotline can be approved and called while declaring nothing at all, and its contract exists only in whoever wrote the adapter's head. A first pass of that audit reported every production example as failing its own schema; that was wrong — the examples are wrapped in {title, input} envelopes and the check had been unwrapping them incorrectly. Corrected before anything was recorded. PROTOCOL (contracts 0.1.8, published run 31089246629, clean-room verified): validateHotlineExamples checks each example against the schema it claims to illustrate and NAMES the failing example; it refuses to pass examples it cannot check, because an absent or uncompilable schema is an error rather than a permissive default. validateHotlineContract adds the publication bar: both schemas, at least one worked example each way, and a statement of what the hotline is NOT for — not decoration, since a hotline with no stated limits will be blamed for everything it was never meant to do, and M3 has to adjudicate those cases. ajv becomes a runtime dependency: schema conformance already had one definition here (the template example tests use ajv) and a hand-rolled second one would drift from it. strict:false, because real declarations carry annotations ajv does not recognise and failing a usable contract over `format: uri` would be its own bug. PLATFORM: enforced at approval, not submission — a device must still be able to enroll (an enrollment that fails on a documentation problem looks like a broken device) and the operator gets one list of everything missing. Refusal is CONTRACT_HOTLINE_INCOMPLETE with an itemised `problems` array. Already-approved hotlines are NOT re-validated: the rule gates publication, and re-validating would disable running production hotlines without anyone choosing to. TWO FIXTURE PROBLEMS OF THE SAME SHAPE, both fixed: the bootstrap hotlines put their examples only into the template bundle, so their catalogue records carried no worked example at all — a fixture its own publication rule would reject; and examples had no single envelope, with real submissions using {title, input}/{title, output} while the seeded demos used {title, description, params}/{..., result}. Two shapes is precisely why nobody could validate them. The demos move to the shape real data already uses, and brand-site's marketplace page reads the new keys with a fallback to the old for existing data. CONSOLE: an itemised refusal renders as a list under a Chinese lead-in rather than a semicolon paragraph — joining them into one sentence is how an operator stops reading at the first item and fixes one problem per round trip. TESTS: protocol 128 (16 new), platform 59 unit + 141 integration (8 new). BROWSER ACCEPTANCE: submitted a hotline declaring nothing (enrollment succeeded, as intended), clicked 批准 in the console, and read back '这个声明还不能作为契约发布,缺少下面这些:' followed by all five problems as separate items. PRODUCTION: rolled v0.4.6 -> v0.4.7 after that acceptance, per owner authorization (2026-08-06 multiple choice: publish 0.1.8 + roll v0.4.7). Images run 31090414810 all three green with the published-image smoke; /platform/buildz reports v0.4.7 git_sha a2e32e9; release-manifest check reports **runtime matches release v0.4.7** with the relay probed through an SSH tunnel. releases/current.yaml promoted to v0.4.7, manifest sha256 9b488521acc8. WHAT THIS NOW BLOCKS, said plainly: local.mineru.pdf.parse.v1 keeps running and keeps serving calls, but it cannot be re-approved until it declares a real contract. The client already has a document_parse_pdf profile with schemas and examples that has never been sent, and that profile is itself stale — it describes the old pdf_path local-path interface rather than the artifact input that actually works since CHG-2026-192. Fixing that is the next unit, owner-chosen, and it is also the first of the three workflows PRD Wave 2 requires to be expressible in one contract."
