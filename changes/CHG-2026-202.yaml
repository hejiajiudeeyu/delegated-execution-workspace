notes: "Follows CHG-2026-201, which made an incomplete declaration unpublishable and thereby made production's real hotline un-re-approvable. This round answers 'where does a contract come from', a question the owner asked directly. THE ANSWER THE CODE GAVE: the client inferred it from the hotline id — buildDefaultContractProfile matches hotlineId.includes('mineru') — and the guess described a `pdf_path` local-file interface the worker has not accepted since the artifact channel landed in CHG-2026-192. Worse, there were two registration paths and only the unused one carried the richer declaration: /controller/register in responder-runtime-core forwarded input_schema/output_schema and had NO FIELD AT ALL for examples, limits or attachments. That is the path production enrolled through, proven by its template_ref 'local.mineru.pdf.parse.v1@v1', which is that path's default. Worst of all, the platform filled the hole: marketplace reads fell back to the template bundle's built-in default, so production was publicly advertising a PDF parser as taking {text, instruction} and returning {summary}. Not a missing contract — a confident wrong one, which is the failure mode this project keeps paying for. OWNER DECISIONS (2026-08-06 multiple choice): contract lives with the worker; platform stops fabricating and says 'not declared'. CLIENT (@delexec/ops 0.1.9 published, run 31094170635): the MinerU worker declares HOTLINE_CONTRACT next to the code that must satisfy it and answers `--contract` the way it would answer `--version` — nothing MinerU-specific, any process adapter can implement it. readProcessAdapterContract asks, and the declaration outranks the id guess. A worker with no --contract support ignores the flag, reads empty stdin and prints its ordinary result payload, which is also valid JSON and would otherwise be adopted as a contract; `contract_version` is the positive signal that separates an answer from silence, and the client's OWN example hotline caught this in review. /controller/register now carries the whole contract. Also closes CHG-2026-197's open item: the client root declared contracts ^0.1.0 while its tests need 0.1.8, and ops declared ^0.1.0 while the packages it bundles need 0.1.5. PLATFORM (v0.4.8): catalogue reads return only what the hotline declared, plus `contract_declared` so a missing contract reads as missing. TESTS: client 161 unit + 113 integration; the load-bearing one checks the WORKER'S declaration against the PLATFORM'S publication bar, so the two cannot drift without a test going red. Platform 59 + 141. PRODUCTION: rolled v0.4.7 -> v0.4.8, `runtime matches release v0.4.8`; /marketplace/hotlines/local.mineru.pdf.parse.v1 now reports contract_declared:false with null schemas instead of the invented summarizer contract. NOT DONE, AND DELIBERATELY NOT DONE BY ME: re-registering the production device. submitCatalogHotline sets status:disabled/review_status:pending unconditionally, so a resubmission takes the only working hotline OFFLINE until an operator approves it — and approval needs the operator credential, which lives in the owner's console session, not with me. Doing half of that pair unilaterally would have left MinerU down for an unknown interval. The payload the device will send was built from the worker's declaration and checked against validateHotlineContract: it passes (4234 bytes). The remaining step is the owner's: update the device to ops 0.1.9, re-register, approve in the console — submit and approve in one sitting."
