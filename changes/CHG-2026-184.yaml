notes: "Client CI went red on CHG-2026-183 and the cause was real, not flaky. platform 1c8f206 flipped ENABLE_BOOTSTRAP_RESPONDERS to false as a fail-safe, and 37 client integration call sites had been relying on that ambient default to read state.bootstrap.responders[0]; without it they failed with 'Cannot read properties of undefined'. client d77422f passes bootstrapEnabled: true explicitly at every site. Worth recording why local runs stayed green: platform-api self-loads the gitignored <platform>/deploy/platform/.env at import time and that file sets the flag true, so a developer machine masks the regression entirely — reproducing CI by flipping that file locally showed the same 16 failures and then confirmed the fix, with client integration 86/86 under CI-like conditions. Client CI run 30640418834 green. Also carries the earlier supervisor fix (f0706cf, never mint a relay credential for a relay it does not manage) which was validated in CHG-2026-183 but landed after that bundle froze. Release manifest refrozen as 2026-07-31-relay-auth against this combination; five-check chain green."
