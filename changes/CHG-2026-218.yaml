notes: "The owner's signing key for mineru_mac_msanqn8p was gone, so they chose to scrap the device and rebuild on this machine. Executed end to end. RETIRED IN PRODUCTION (owner-authorised, 'delete the old one'): the hotline first, using the endpoint CHG-2026-217 added, which freed the id; then the device. Withdrawn, not deleted — both records survive and the calls already bound to the old hotline keep the versions they pinned. The attention feed went to zero. REBUILT: a DEDICATED ops home at ~/.delexec-mineru, deliberately not the default one, which is full of localhost test hotlines that must never reach production. New device mineru_mac_rebuilt, its own caller credential, the repo's reference MinerU process-adapter worker, and the hotline re-registered under the SAME id — the point of the retirement. THEN THE SYSTEM CAUGHT ME. The first approval was REFUSED by the publication gate: 'not_recommended_for or limitations must state what this hotline is not for'. The worker declares all of it; the draft had been built moments earlier from an adapter command that could not spawn (I fixed the command after adding the hotline, not before), so readProcessAdapterContract got silence and the guessed profile carried empty guidance. My sequencing error, and CHG-2026-201's gate is exactly what stopped an incomplete contract reaching the catalogue. Regenerated from the working worker and it published. TWO REAL BUGS THE DEPLOYMENT FOUND WITHIN MINUTES, both structurally invisible to a local stack: (1) the skill adapter built URLs with new URL(path, base), which DISCARDS a path prefix — production is served under /platform, so every catalogue read went to the marketing site and returned HTML, surfacing as HOTLINE_CONTRACT_SOURCE_UNAVAILABLE. The whole agent-callability path shipped in CHG-2026-204 could not read a production catalogue at all; the local e2e uses a bare origin and could never have shown it. Fixed with the prefix-safe join the artifact client already had, with a regression test that serves the catalogue under a prefix. (2) the registration draft hardcoded input_attachments/output_attachments to null while buildDefaultContractProfile reads them off the worker and the platform publishes them — the same declared-upstream-dropped-downstream shape as unit 8's platform projection, and for a document hotline it is the contract's most load-bearing sentence: how a caller learns a PDF is required and how to send it. VERIFIED IN PRODUCTION: local.mineru.pdf.parse.v1 is enabled, approved, callable, published_version 2, and an agent reading it through the caller-skill surface gets contract_source=platform_catalog with the schemas, both example sets, three not_recommended_for entries and the full attachment declaration. That is the first time the network's only real hotline has published a contract at all. Client 162 unit + 132 integration. NOT DONE: no npm publish for these two fixes yet, and the production replay of the full call chain needs the device's supervisor running."
