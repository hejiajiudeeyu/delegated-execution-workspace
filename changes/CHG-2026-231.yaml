notes: "M3's first production evidence, and the owner ruling that made it reachable. THE RULING (2026-08-10): a hotline PUBLISHED on the platform is called through the platform, even when this device happens to be the one serving it. Before it, the skill adapter decided local-vs-remote by asking which catalogue answered the lookup first, so a device that both hosted and called a hotline resolved its own copy and dispatched locally. That branch issues no task token, fetches no delivery metadata and uploads no input artifacts - and never touches the platform at all, so the call got no delivery grading, no acceptance window and no settlement. A published hotline silently lost every guarantee M3 exists to provide, on exactly the machine most likely to be exercising them. `remote` now follows publication status through one shared predicate; `review_status: local_only` remains the marker for a hotline that really is only this machine's. ALSO REQUIRED: the caller skill surface could not attach a file at all. The only real hotline on this network declares a required PDF and how to send it, and an `attachments` argument was silently dropped - prepare answered ready and the responder rejected the call for having no input document, so an agent following the published contract exactly could not satisfy it. Read at prepare rather than dispatch, so a missing file is a preparation error the agent can still fix. THE RUN (req_a4d33db1-4ad6-4ddf-b85c-03b82db07fdb, production v0.4.16 + ops 0.1.20): agent-side throughout, only the caller skill surface and only caller credentials. HOTLINE_VERSION_BOUND, then TASK_TOKEN_ISSUED and DELIVERY_META_ISSUED - which is the proof it went through the platform rather than short-circuiting - input PDF over the artifact channel, 22 output artifacts committed, COMPLETED. Real MinerU: 51,648 bytes of markdown, 131 blocks, 20 images, about three and a half minutes unattended. THE ACCEPTANCE GATE HELD: a window opened on delivery with window_seconds 259200, read from the terms frozen into the Call rather than today's catalogue, and the caller accepted through its own surface with decided_by caller. No BILLING_SETTLED anywhere in the event stream - the responder reporting COMPLETED released nothing. TWO THINGS THIS DOES NOT PROVE, recorded rather than glossed: delivery_integrity's value was not read directly (no production operator credential on this machine), though the window only opens when a grade exists, so grading demonstrably ran; and the MONEY half has no production evidence, because local.mineru.pdf.parse.v1 declares no pricing_hint and the settlement axis honestly reports the call as unbilled. hold to accept to settle is proven only in tools/agent-callability-e2e.mjs, against Docker Postgres with billing enforced. Proving it in production needs a priced hotline. TESTS: client 167 unit + 141 integration. The routing ruling is pinned on the dispatch decision itself (local_only) rather than on the label discovery shows, against a fixture that declares a contract - an approved hotline without one is a shape the publication gate has made impossible since FR-010, and the earlier version of this test failed on that rather than on the rule it was named for."
