notes: "Owner authorized three things on 2026-08-02 (decisions.md D6): reopen the public relay edge, implement input artifacts as part of unit 6, and cut a release to roll production. All three done. INPUT ARTIFACTS (client 86d1ac9): the ledger recorded FR-032 as done but uploadArtifact was only ever reached through the responder's output path — no caller code uploaded an input artifact and no responder code fetched one, so a real PDF could only ride inline inside the task envelope. The platform already allowed it (canAccessRequestArtifacts admits both parties, role=input was already accepted), so this was client-only. Caller uploads with role=input and puts descriptors in the envelope; an upload failure is fatal rather than falling back to inline, because unlike a failed output upload there is nothing invested yet and inlining would ship a task whose input the responder cannot read. Responder fetches just before execution, so a task that never runs never pulls a document down, and refuses to execute on an unfetchable input rather than producing a confident result from nothing. Reference MinerU worker added on the same shelf as the example one. RELAY EXPOSURE (platform 6fccba7 + production nginx): CHG-2026-181 closed the relay at the edge because it was unauthenticated; CHG-2026-183 fixed that and the edge was never reopened, which is precisely what made a cross-device Provider impossible. Verified the deployed relay first — all four business routes answer 401 without a bearer and 401 with a bogus one, and f26a08b is an ancestor of the deployed build — then reopened Caddy and the production nginx. Compensating control: RELAY_ADMIN_TOKEN and RELAY_TOKEN_SECRET joined the workspace secret-hygiene set, so a public stack carrying placeholder relay credentials is now a blocker; production was checked and carries real values with RELAY_ALLOW_UNAUTHENTICATED unset. STUCK-CALL FIX (platform 539e0e7): writing the failure matrix exposed that isStuckCall read `latest.recorded_at` while appendRequestEvent stamps `at`, so the lookup was always undefined and the guardrail against a silent permanent pending had never fired on real data. Its test passed only because it hand-set `recorded_at`. Fixed and shipped as v0.4.1 because v0.4.0 had already been rolled with it broken. FAILURE MATRIX: all nine modes now have named behavior and evidence — seven platform cases (offline before accept, duplicate submission, duplicate delivery, partial artifacts, restart, timeout+grace, expired token) and two responder-runtime cases (replay-not-re-execute, retry as a distinct attempt). REAL RUN: two cross-device MinerU tasks completed unattended through production. Run 1 on v0.4.0 (req_mineru_msanvt2v): a 336919-byte PDF crossed as an input artifact in a 1498-byte envelope, the device confirmed the bytes byte-identical by sha256, MinerU produced 3248 bytes of markdown in 16.3s, and the caller verified the output checksum. Run 2 on v0.4.1 with a different PDF returned markdown plus two extracted images, all three checksums verified. The platform's own call-detail aggregate independently shows the full timeline and both artifacts committed. PRODUCTION: rolled v0.3.0 -> v0.4.0 -> v0.4.1, all three images together. An honest note on the roll: the first attempt ran `docker compose up -d` without the aliyun-nginx override, which created the Caddy edge container production does not use and left postgres unable to bind its port; the site was 502 for roughly two minutes until redeployed with the override. The override also pinned the gateway to a literal v0.3.0 tag, now changed to follow IMAGE_TAG so the three cannot drift apart again. E6 REMAINS UNMET: the task flow itself used no SSH, no remote desktop and no manual file carrying, but operator approval of the device and hotline still required admin curl because the console rebuild is backend-only so far. That is recorded rather than papered over."
