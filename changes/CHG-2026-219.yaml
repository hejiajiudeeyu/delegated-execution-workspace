notes: "Client-only release of the two bugs that pointing an agent at the real deployment found within minutes, both structurally invisible to a local stack (CHG-2026-218 has the full account). (1) The caller-skill adapter built catalogue URLs with `new URL(path, base)`, which DISCARDS a path prefix — production is served under /platform, so every read went to the marketing site and returned HTML. The entire agent-callability path shipped in CHG-2026-204 could not read a production catalogue at all; the local e2e uses a bare origin and could never have shown it. (2) The registration draft hardcoded input_attachments/output_attachments to null while the worker declares them and the platform publishes them — for a document hotline that is the contract's most load-bearing sentence, the one telling a caller a PDF is required and how to send it. WHY A RELEASE OF ITS OWN: the fixes were already exercised against production before publishing — an agent read the live MinerU contract in full, and a real 336,919-byte PDF went discover-to-delivery — but they existed only as repo source. Anyone running `npm i -g @delexec/ops` got 0.1.12, which still could not read a prefixed catalogue. Publishing is what makes the proof transferable. Platform images unchanged from v0.4.12; only the npm package moves, so the manifest is v0.4.12-ops.0.1.13 rather than a new platform version — a client-only combination still has to be a named, frozen combination or `release-manifest check` has nothing to compare production against. Client 162 unit + 132 integration; publish run 31323218844. NO PRODUCTION ROLL: nothing server-side changed, and production already runs v0.4.12. AND THE RELEASE TOOL HAD TO LEARN THIS SHAPE: naming the combination v0.4.12-ops.0.1.13 immediately made `release-manifest check` report all three services as drifted. They were not — a service reports the release_id baked into its IMAGE, and the images had not moved. The comparison had always used the combination's NAME, which worked only because until now every release moved the images too. It now compares against the image tag the manifest DECLARES for that component, which is not a loosening but a tightening: it answers 'is production running the image this combination certifies', which is the question the gate exists to ask. Two regression cases added in the tool's own harness, both red before the fix — one that a client-only combination is not drift, one that a service running an undeclared image still is."
