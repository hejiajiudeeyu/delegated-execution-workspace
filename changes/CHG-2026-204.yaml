notes: "First unit of the 2026-08-09 plan (decisions.md D8.1: M2 wrap-up plus agent callability). Units 1-3 made the contract itself strong — a publication gate, frozen versions, a Call that pins one — and the 2026-08-09 survey then found the reading end of the chain severed in the middle. THE STATE IT WAS IN: `read_hotline` and `prepare_request` both required a local hotline-registration draft, and drafts are written by whoever REGISTERS a hotline, on the responder's machine. On a caller-only machine — which is what an agent runs on — there are none, so the official discover/read/fill/call path answered 404 for every hotline in existence. Worse, the branch that did succeed returned a hand-picked subset of the record: exactly the worked examples, `not_recommended_for`, `limitations`, `pricing_hint` and attachment declarations that CHG-2026-201 had just forced every publisher to write, and that an LLM needs most to fill a request in correctly. CLIENT: the platform catalogue becomes the contract source of truth for a caller (GET /v2/hotlines/:id, uncredentialed, the same record the publication gate checked and a Call pins); the draft demotes to offline fallback. The two are never merged field by field — a contract assembled from two records is one nobody published, which is the CHG-2026-202 failure mode. The response passes through HOTLINE_VERSION_CONTRACT_FIELDS whole rather than a curated subset, so the next field the protocol adds arrives without a client change. Failure modes are kept apart on purpose: platform unreachable is HOTLINE_CONTRACT_SOURCE_UNAVAILABLE (502, retryable), never 404, because collapsing 'cannot ask' into 'does not exist' sends the caller hunting for a hotline that is there; a hotline that declared nothing is HOTLINE_CONTRACT_NOT_DECLARED (409), which is production's own hotline today, approved before the gate existed. SEARCH: a purely Chinese query tokenized to zero terms, and the zero-terms branch returned the first N hotlines in id order — a plausible answer unrelated to the question, measured at four unrelated hotlines in the test. CJK now survives as whole runs plus bigrams, and the load-bearing assertion is the negative one (a Chinese query matching nothing returns nothing). Also: the matcher searched `description`, which the platform's list projection does not send — it sends `summary` — so a platform hotline was matchable by id and title and nothing else. PLATFORM: the public detail projection dropped `input_attachments` / `output_attachments` / `service_id`, which were stored at submission; a caller learned a PDF was required by being rejected. A field forced at publication and then withheld from the reader is worse than one never required, because the publisher believes it was communicated. TESTS: client 161 unit + 118 integration (5 new, against a REAL platform-api — a fake cannot be wrong about which fields the real catalogue projection drops, which is the whole claim); all five fail on the previous code. Platform 59 unit + 153 integration (1 new, likewise red before the change). NOT IN THIS UNIT: prepare_request still uses the hand-rolled shallow validator rather than ajv, MCP still exposes one generic tool instead of per-hotline projections, and the review slot is still hardcoded `not_required` — those are units 9 and 5, in that order. No npm publish and no production roll: the change is inside @delexec/ops's bundled bytes but the units after it touch the same files, so one release at the end of the batch rather than four."
