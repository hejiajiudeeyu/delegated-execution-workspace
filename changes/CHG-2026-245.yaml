notes: "Follow-on to CHG-2026-244, which fixed the CLI dropping a worker's service terms. The command that exists to catch exactly that drift never reported it: contract-check diffs six fields and service terms were not among them, nor were the attachment declarations whose loss is what shipped a document hotline nobody could call. Widened to both. Service terms are compared only where the worker declared one, because silence is a request for the platform's default rather than a disagreement with it — the MinerU worker names no tier and must not be reported for it. AND IT WAS INVENTING DRIFT. Pointed at the production device it reported local.mineru.pdf.parse.v1 as drifted on input_schema, output_schema, both example sets and both attachment declarations, while every one of them was identical: it compared JSON.stringify output and the platform hands these back in its own key order. The remedy it printed, `responder register`, could not have changed anything. Comparison is now by value — object keys sorted, array order preserved because the order of worked examples is part of what they say — and an empty list is treated as no list, since the platform normalizes an undeclared not_recommended_for to [] and that read as permanent drift for every worker that named no exclusions. VERIFIED AGAINST PRODUCTION, BOTH DIRECTIONS, from a copy of the real device home so nothing was written to it: local.mineru.pdf.parse.v1 goes drifted -> in_sync, and local.echo.priced.v1 goes in_sync -> drifted and is right — that hotline declares `quick` and the catalogue publishes `standard`, so every paid call on it carries a 72-hour acceptance window in place of the 24 its publisher chose, and a 1800 s budget in place of 300. That is CHG-2026-244's bug, live, on the one hotline where the window governs when money settles. Production is otherwise clean: MinerU declares no tier at all, so the standard defaults it carries are the platform's, legitimately applied. ops is bumped to 0.1.23 in source. NOT DONE HERE: nothing is pushed or published, so no device has any of this yet — including the one serving local.echo.priced.v1, whose repair needs 0.1.23 installed, a re-registration, and an operator approval, since the corrected declaration moves the digest and re-enters review. releases/current.yaml still points at the frozen v0.4.18-ops.0.1.22 combination, which this client SHA is not part of."
