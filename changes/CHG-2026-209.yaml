notes: "M2 unit 11 (owner decision D8.4), taken before unit 6 for the same reason as unit 10: it sits on the plan's exit-criterion chain and unit 6 does not. THE GAP: the only way to learn a call had ended was to keep polling, so any task longer than a terminal session either held the terminal open or lost its result. Polling is untouched and stays the fallback — a webhook the caller's own network drops must not become the only route to a result the platform already holds; a test asserts the no-callback path still returns the terminal event by poll. REGISTERED WITH CALLER CREDENTIALS, not operator ones. This is the decision the whole unit turns on: an operator-only configuration surface would have made the feature useless for the case it exists for, which is an agent on a machine that holds no operator credential and never will. FOUR THINGS THE TESTS PIN DOWN. (1) The result is deliberately NOT in the payload. A webhook body is the least controlled place a private document could end up, so the notice carries the request id, which contract version the call was bound to (CHG-2026-200/206, so the receiver need not ask the catalogue what the terms are now), the four state axes, and a URL the caller fetches over its own authenticated channel; the test asserts the raw body contains neither `result_package` nor `output`. (2) Delivery does not block the responder reporting its result — a caller whose receiver is slow must not slow the network down and must certainly not fail someone else's call — so it is fired without awaiting and the outcome recorded when it lands. (3) One notice per call: a retried or deduplicated terminal event is the same news, and telling a caller twice that its call finished is worse than a little silence. (4) An event name the platform will never send is refused at registration rather than accepted and silently never delivered, which would leave the caller waiting for something that was never coming. Delivery outcomes are readable by the caller over `/v1/callers/me/callback/deliveries`, for the reason FR-066 already settled: a webhook that quietly stopped working reproduces the exact silence this feature replaces. Reuses `alerts.js` deliverAlert, so the HMAC signature, the 5xx retry and the 4xx no-retry are the same code path already carrying the operator's alerts rather than a second implementation that could drift. Callbacks and their delivery history survive a restart — a caller should not have to notice a platform restart and register again. Events cover COMPLETED, FAILED and TASK_TOKEN_EXPIRED; the last is fired from the expiry path itself, where the caller is by definition not watching because nothing came back. CLIENT: `delexec-ops caller callback set|show|clear` and `caller callback-deliveries`, so registering it needs no curl. Setting a new URL omits the secret rather than nulling it, so changing where notices go does not silently drop a signing secret configured earlier — the same rule the alert config follows; the secret is never readable back on any surface. TESTS: platform 59 unit + 169 integration (6 new, against a REAL HTTP receiver — a stub would let 'nothing arrived at all' pass as success, which is the failure mode FR-066 was built to avoid); client 162 unit + 126 integration (1 new CLI case). CORRECTION TO EARLIER ADVICE: while reviewing the plan I suggested this unit also cover 'a prepared request waiting on confirmation'. It cannot — the confirm queue from unit 9 lives in the caller's own skill adapter and the platform never sees a prepared request. That notification belongs on the client side and is not built here. NOT DONE: no npm publish and no production roll — batched to the end of the units, pre-authorised 2026-08-09."
