notes: "Third delivery unit of M3. Unit 2 gave the caller a yes; this gives them the other two answers. AGAIN NO PROTOCOL RELEASE: the acceptance transitions including revision_requested and disputed, and the settlement BLOCKED state with its 'only valid while a dispute is open' cross-axis rule, were all frozen in M1. The plan expected a contracts batch for units 2 and 3 together and neither needed one; contracts stays at 0.1.10. REVISION: one in-scope revision at no extra price (A-06), which falls out of not creating a second hold rather than being a rule enforced anywhere — the money never moves, so there is nothing to not charge. Re-delivery restarts the acceptance window rather than adding a second one. A second revision is refused: out-of-scope or further work is an explicit new Call, and a free second round would be a silent unpaid expansion of what the fixed price bought. The counter lives on the Call rather than being inferred from the event log, because 'how many revisions has this had' must survive event-history trimming. Scope is returned as the pinned hotline_version, so the question is answered against the contract that was agreed rather than whatever the catalogue says now. DISPUTE: settlement goes to blocked, which closes the exits rather than moving anything — the money left the balance at hold time, and what a dispute suspends is settle and the auto-accept that would have reached it. Asserted directly that an expiring window does not step over an open dispute. TWO THINGS THAT HAD TO CHANGE FIRST, both of which would have made revision quietly not work rather than visibly fail. (1) Terminal-event dedupe was keyed on (event_type, responder, hotline), so the second COMPLETED of a revised call was swallowed as a duplicate and never reached grading, the timeline or settlement; it is attempt-scoped now, the same way progress events already solved this, and an event with no attempt_id still matches only other events with no attempt_id so existing calls are unaffected. (2) buildCallStateAxes mapped any unrecognised billing state to 'none', so a disputed call would have reported as having no billing at all — the one reading that makes a frozen settlement invisible. THE CLIENT-SIDE SCOPE ADDITION, flagged to the owner before starting and authorised: the responder inbox deduped on request_id alone and re-sent the stored signed result, so a revision would have returned a copy of exactly the output the caller objected to with a fresh timestamp on it. An envelope whose attempt_id differs is now new work; the same attempt_id is still a replay, because retrying delivery must not re-run an execution. The re-attempt gets its own task record so the attempt being revised keeps its own signed result — the journal and any later question about what was delivered the first time both depend on that surviving. THE FEED: open disputes are reported with severity 'action', and the dispute_open placeholder that had sat in not_tracked since the feed shipped is removed in the same change. An honest blank must not outlive the real value; the test that asserted its presence now asserts its absence, for that reason. TESTS: platform 59 unit + 220 integration (6 new); client 162 unit + 139 integration (1 new, red before the fix and red in the same shape). M2 exit harness still 27/27. NOT RELEASED: no image, no publish, no production roll — production is on v0.4.14."
