notes: "M2 unit 9, the client half of what CHG-2026-206 made sayable. Three things a publisher could declare that nobody on the caller side read. VALIDATION: `prepare_request` checked input with a hand-rolled walker that read `type` and `enum` on top-level properties and nothing else — `pattern`, `minimum`, `maxLength`, `format`, array items and every nested object were declared by the publisher, enforced by nobody here, and discovered by the responder rejecting the call minutes later, which is precisely the moment an agent filling in a form cannot learn from. Now enforced by ajv 2020: the same engine, and the same `strict:false` settings, that the publication gate used to ADMIT the schema, so the two sides cannot disagree about what the contract means. The per-field `{field, code, message}` output shape is kept deliberately (a flat list of ajv strings is not something a model can act on field by field) and nested paths report as `options.language`. A schema this side cannot compile reports HOTLINE_INPUT_SCHEMA_UNUSABLE against the CONTRACT rather than blaming the caller's input — the alternative sends the agent rewriting a request that was never the problem. CONFIRM (D8.2): the review slot was the literal `{required:false, status:'not_required'}` for every hotline in the network. That was not a placeholder for an unbuilt feature; it was an answer to a question the protocol could not ask until unit 5 landed. It now derives from `fulfillment_mode`, and `send_request` returns 409 PREPARED_REQUEST_CONFIRMATION_REQUIRED until someone confirms — an agent that could send anyway would make `confirm` a label rather than a rule. The queue and confirm/reject actions live at /skills/caller/approvals, which is exactly where the Ops supervisor's console proxy has pointed all along: at /skills/remote-hotline/approvals, a route that has never existed in any version of this adapter, so that console view has answered 404 since the day it was written. Dead route reconnected rather than deleted, per the plan's two options, because the confirm flow needed the queue anyway. Both new actions are listed in the skill manifest — a gate the agent cannot see is a gate it will read as a bug. PER-HOTLINE MCP TOOLS: the six generic tools took `input: z.record(z.string(), z.unknown())`, so the host could not check a parameter, autocomplete a field name, or show the model what THIS hotline wants. Each callable hotline now gets its own prepare tool built from its contract's input_schema, carrying what the hotline is NOT for in the description — the sentence most likely to stop a wrong call, placed where the model chooses the tool. The projection is top-level only and never adds a constraint the contract did not state, so it can only be LOOSER than the contract, never stricter: a host will never reject input the hotline would have accepted, and ajv still names the offending field inside prepare. Registered on the McpServer rather than only in the raw JSON-RPC tools/list, because both real transports (stdio, streamable HTTP) go through that server and a projection the host cannot see is not a projection. An unreachable catalogue costs the per-hotline tools and never the generic six, which are how an agent would find the hotlines by hand instead. Projection caps at 24 hotlines, stated in code rather than truncated silently (current public network: 1). TESTS: client 162 unit + 122 integration (4 new cases against a real platform-api, covering nested/pattern/range violations named by field, the uncompilable-schema attribution, the confirm gate end to end through the approvals queue, and an auto hotline being left alone). LOCKFILE: skill-adapter now declares ajv and contracts ^0.1.9. NOT DONE: no npm publish and no production roll — batched to the end of units 4-11, pre-authorised by the owner on 2026-08-09."
