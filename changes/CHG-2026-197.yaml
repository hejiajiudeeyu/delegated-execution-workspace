notes: "Usability-sprint unit 2 (decisions.md D7). Before this the platform had NO outbound capability at all — no SMTP, no webhook, no dependency of any kind — so every problem it detected waited for someone to open the console; the 2026-07-04 outage ran 5.5 hours and was found by walking into it. Owner chose webhook delivery with a 6h renotify window (two multiple-choice questions, 2026-08-06). ONE DEFINITION OF WRONG: alerts are derived from buildAttentionItems(), extracted from the /v1/admin/attention handler so the feed and the alerter read the same computation — a second opinion would drift, which this codebase has already paid for once (isStuckCall read a field production events never carried, so the guardrail never fired on real data). The read endpoint keeps its 20-target display cap; alerting deliberately does not inherit it, since a device that sorts 21st is not less broken, and a test pins that. SEMANTICS: alerts open on first appearance, repeat every renotify_hours while unresolved, and close exactly once — so silence after an alert always means resolved, never forgotten. Tracking is per (kind, target_id), so one device recovering cannot silence another, and it rides the persisted snapshot so a restart does not re-page about every open problem. Delivery is HTTPS POST with optional HMAC-SHA256 over the raw body (x-delexec-signature), retried twice on 5xx/timeout but never on 4xx, and every attempt — especially the failures — is recorded and shown in the console, because a webhook that silently fails reproduces exactly the silence this feature exists to end. DEAD MAN'S SWITCH: platform-api cannot report platform-api being down, which is precisely the incident that motivated FR-066, so shipping only in-platform alerts would have left the motivating failure uncovered while creating a false sense of coverage. A separately configured liveness_url is GET-pinged on a schedule (Healthchecks.io / Uptime Kuma push / BetterStack heartbeat shape) and the external monitor alarms when pings stop. Both the console page and /v1/admin/alerts/status name platform_down as not covered by the webhook leg, following the same rule the attention feed already set: an unbuilt thing must say so rather than let its silence read as health. NFR-R05: OFFLINE_THRESHOLD_S 180s -> 120s (four missed 30s heartbeats); 180s could not meet 'detect offline within 2 minutes' no matter how fast anything downstream reacted. Config is console-editable and persisted (E6: no SSH for normal work), the secret is never echoed back, an omitted secret on a later edit keeps the stored one (otherwise changing the renotify window from a page that is never shown the secret would silently unsign every future alert), and the audit record keeps the URLs but never the secret (NFR-S03). Tests: 12 new platform integration cases, every one delivering to a REAL local HTTP receiver rather than a stubbed fetch — the failure this prevents is 'nothing arrived', which a call-recording stub passes straight through; platform 45 unit + 123 integration green, plus service-packages/deploy-config/release-docs gates. LIVE ACCEPTANCE (browser + real receiver, not tests): device heartbeat aged past the threshold, the alert loop fired unprompted and delivered a signed 'opened device_unavailable' notice, the console alerts page showed the delivery and the open alert, a real heartbeat recovered the device, and the '已恢复' notice arrived on its own ~15s later; liveness ping observed arriving at its own cadence. Protocol: CONTRACT_INVALID_ALERT_CONFIG registered in the error catalogue; contracts bumped 0.1.5 -> 0.1.6 in source rather than amending 0.1.5, because npm's 0.1.5 is published and immutable and same-number-different-content is the exact trap this project has paid for. NOTHING IMPORTS THE NEW CODE (the platform emits the string literally), so this round is not blocked by publication. PENDING OWNER AUTHORIZATION, tracked here so it is not lost: (1) publish @delexec/contracts@0.1.6 — until then the honest state is 'source one version ahead of npm'; (2) cut and roll production v0.4.5 — production is on v0.4.4 and therefore has no alerting yet. Also still open from CHG-2026-196: the ops root package declares contracts ^0.1.0 and should state its real floor at the next client round."
