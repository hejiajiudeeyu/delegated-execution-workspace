notes: "Usability-sprint unit 1 (decisions.md D7): a long call stops being a black box between ACKED and COMPLETED. Protocol freezes OBSERVATIONAL_REQUEST_EVENT (PROGRESS/SOFT_TIMEOUT) deliberately OUTSIDE the CALL_EVENT transition vocabulary — progress is an observation, not a fifth axis — with validateRequestProgress (monotonic per-attempt seq, three-stage vocabulary, bounded percent/message, unknown keys actively rejected) and two registered error codes; contracts 0.1.4 -> 0.1.5, published as run 31013054782 after owner authorization, clean-room verified. Client narrates input_fetching before pulling caller bytes, executing before the hotline starts, output_uploading before artifacts leave, plus an optional hooks.reportProgress for adapters that know 'page 4 of 10'; strictly best-effort — every posting path swallows failure, local-only runs stay silent and unchanged. Platform accepts the pair on the existing authenticated events route: no billing, no execution-projection movement, 409 once terminal, (responder_id, attempt_id, seq) dedupe, and PROGRESS pruned against its own budget (PLATFORM_REQUEST_PROGRESS_HISTORY_LIMIT, default 50) so telemetry can never evict lifecycle events. Deliberate, test-pinned consequence: progress freshens last-event time, so isStuckCall finally distinguishes a grinding long task from a silent one. Console renders progress rows hollow and grey in the /calls/:id timeline. CLOSES A SILENT DEFECT: the responder has posted SOFT_TIMEOUT since the hook existed and the platform 400-rejected every one, both sides swallowing it — the observations nobody could see now land. Tests: protocol 39 unit (5 new); platform 7 new integration (45 unit + 111 integration green), including prune-preserves-lifecycle and stuck-freshness; client 3 new integration against real platform-api (151 unit + 113 integration green). Acceptance: seeded local stack (platform-api + gateway on 8085 + real responder runtime), 8-beat 40s task, browser-verified twice — one full timeline with 5s-spaced beats 13%..100% plus per-page messages, and a second live task observed at 13% then again past 100%+upload; screenshots in session record. TWO REAL BUGS FOUND BY GOING THROUGH THE MOTIONS: (1) CallDetailPage rendered an error body as a call — visiting a detail link before unlocking (or any session expiry on the page) crashed to a white page on call.state.execution; fixed with an ok-guard (platform bb0b2e7). (2) Both owning repos' lockfiles still pinned contracts 0.1.4, which local dev never sees because node_modules symlinks the sibling protocol checkout: the client publish run failed in CI and the v0.4.4 image build failed in the published-image smoke gate with platform-api dying at import — exactly the gates doing their job. Fixed by declaring the real >=0.1.5 floor where the imports live (platform-api, responder-runtime-core) and updating both lockfiles (platform 3eab8db, client b9adf9e); v0.4.4 tag re-cut (no artifacts existed from the failed build). Known leftover: the ops root package still declares contracts ^0.1.0 — fresh installs resolve 0.1.5 so the published 0.1.8 works (CI clean-room proved it end-to-end), but the floor should be stated at the next client round. Releases after owner authorization: @delexec/contracts@0.1.5 (run 31013054782), @delexec/ops@0.1.8 (run 31016666317, second attempt after the lockfile fix; published bytes spot-checked to contain the narration code), platform v0.4.4 images (run 31016488978, all three + smoke green). Production callanything.xyz rolled v0.4.3 -> v0.4.4 with both compose files per runbook; /platform/buildz and /gateway/buildz report release_id v0.4.4 git_sha 3eab8db, relay healthz 200, edge routing untouched. Fourth-repo five-check chain green on the final SHA set."
