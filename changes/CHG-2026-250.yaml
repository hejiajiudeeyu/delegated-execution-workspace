notes: "Found by trying to make a call, not by reading code. On 2026-08-18 a from-zero walkthrough started the production device and every relay inbox poll answered 401: `receiver token has expired`, issued 2026-08-09 with a 7-day TTL, dead since 2026-08-16. THE DEVICE HAD BEEN DEAF FOR TWO DAYS AND EVERY SURFACE SAID IT WAS FINE — heartbeat travels to platform-api and task delivery travels through the relay, so the device reported healthy every 30 seconds while it could not read a single task; the catalogue kept `callable: true`, the console kept showing a healthy device, attention had nothing. AND THERE WAS NO WAY BACK THROUGH THE FRONT DOOR: the caller has had a self-service inbox route since D8.4 (`POST /v1/callers/me/relay-inbox`, whose own comment calls it 'the narrow, caller-shaped hole'), the responder had none, and a receiver token is minted with RELAY_ADMIN_TOKEN which lives only in the deployment env on the platform host. Recovery meant SSH — precisely what E6 says the normal path must never require. THE RETRY MADE IT WORSE, NOT BETTER: 401 is `retryable: false` and the inbox loop retried it four times a second anyway, 432 attempts in three minutes, every one refused, every one logged identically, drowning the single line that carried the information. PLATFORM: new `POST /v1/responders/me/relay-inbox` mints a receiver-scoped token for the authenticated device, receiver derived from the credential and never read from the request (asking for a token must not become a way to ask for someone else's inbox); the relay admin token stays on the platform and is asserted absent from the response. `resolveCatalogAvailability` now lets an expired credential outrank a fresh heartbeat, beside the existing rule that a stale heartbeat outranks a stale self-report — but ONLY for a credential this platform issued: out-of-band tokens leave `relay_credential_expires_at` null and null keeps meaning no opinion, which is what stops this grounding every device the platform did not personally credential (today, all of them). The four availability values are unchanged and the reason sits beside them, because an expired credential and an offline laptop are different jobs and `1 台设备不可用` sent the operator to restart a machine whose problem was a credential. CLIENT: the transport tells a dead credential from a bad day (401/403 raise RelayAuthError, other statuses stay retryable, message unchanged so existing matches still work) and reads its token at use time so a renewal does not tear down the inbox loop, the leases and the in-flight work with it; the inbox loop reports `offline` + `relay_unauthorized` — the device is the one party that can still reach the control plane to say the other channel is gone — then renews and backs off to a minute, skipping the backoff when the new credential works; the supervisor renews before the responder starts and persists into state.config (writing to getRuntimeTransport()'s return value would have been discarded — it normalizes a fresh object every call); the responder controller renews in flight WITHOUT persisting, because ops.config.json has one owner. Tests: platform 13 integration (13/13 red before), client 14 unit (13 red before; the fourteenth asserts a transient 5xx keeps the normal cadence and passes on both sides, which is why it is there). Full suites green: platform 261, client 183 unit + 144 integration, plus test:service:packages, test:deploy:config, test:release:docs, test:packages. NOT DONE HERE: no npm publish and no image build, so no deployed device or platform has any of this yet — the production fix on 2026-08-18 was the manual SSH mint recorded in issues/0002, and `releases/current.yaml` still points at v0.4.18-ops.0.1.24, which does not contain these SHAs. Items 4 and 5 of issues/0002 (expiry pre-warning in attention, `delexec-ops doctor` surfacing this) are also not done. And an expired credential under `best_effort` still leaves a hotline callable by design — the relay queues and the device collects on return — so the operator-facing attention item, not the catalogue, is what carries this for the production hotlines."
