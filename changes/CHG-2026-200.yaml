notes: "First delivery unit of M2 (goal written this round at .trellis/tasks/07-31-M2-hotline-service-contract/goal.md, which previously held only a task.json stub). THE GAP, READ FROM CODE RATHER THAN THE LEDGER: state.catalog holds one mutable record per hotline and a resubmission overwrites it in place (server.js catalog.set), while a Call recorded only hotline_id — not in the request, not in the task token claims, not in delivery_meta. So a Provider could change the schemas, limitations and pricing of a contract while a call made under the old ones was still running, and afterwards nothing could say which contract the call had agreed to. submission_version does not help: it counts submissions and labels a record about to be overwritten. validateHotlineVersionRef had been frozen since CHG-2026-185 and nothing produced such a ref. M3 must decide whether a delivery met its contract, allow one in-scope revision, and adjudicate disputes; all three are unanswerable while 'which contract' has no answer, so this is M2's first unit rather than a later polish. PROTOCOL (contracts 0.1.7, published run 31085567513, clean-room verified: 9 new exports present, digest stable across key ordering): the frozen HotlineVersion document, a sha256 digest over its contract fields, and canonicalJsonString — keys sorted at every depth, because JSON.stringify preserves insertion order and a digest that depends on who computed it cannot answer the only question it exists to answer. A version freezes the WHOLE published document rather than a chosen 'semantic' subset; arguing about which field is semantic is how a field that mattered ends up outside the freeze. validateHotlineVersionRef now rejects a malformed digest instead of ignoring it — a ref carrying an unverifiable digest is worse than one carrying none, because it looks like the binding was checked. Additive: a digest-less ref is still valid, which is the shape M1 shipped. PLATFORM: approval is publication, so approval is when the contract freezes into a version. Publishing is idempotent by content — re-approving unchanged content keeps the existing version, since a number meaning 'someone clicked approve twice' is noise in the record an operator reads during a dispute. A Call binds before anything is charged or dispatched (the HOTLINE_VERSION_BOUND event precedes BILLING_HELD, and a test pins that order) and keeps its version: re-issuing a token is not a new agreement. The binding rides claims.hotline_version and delivery_meta.hotline_version, so the responder is told which contract it is executing and the binding cannot be edited in transit. Reads for a bound call go to the pinned version, never the catalog — showing an operator today's contract is the mistake the pin prevents. GET /v2/admin/hotlines/:id/versions reports each record's integrity: a stored version that no longer hashes to its own digest was edited in place, and saying so is the only way that ever becomes visible. Hotlines approved before versions existed get one on first binding, so legacy state converges. A call with no pin reports 'predates versioned hotline contracts' rather than borrowing the current contract — the same tracked:false honesty rule the attention feed set. CONSOLE: /calls/:id shows the pinned version, the content digest, and says plainly when the hotline has moved on since. TESTS: protocol 19 new unit cases (112 total green); platform 10 new integration cases (59 unit + 133 integration green), the load-bearing one being that republishing a contract mid-flight does not move a bound call. LOCAL ACCEPTANCE IN A BROWSER, not only tests: approved a hotline (v1), issued a call, changed the contract and re-approved (v2), and the console call detail rendered '契约版本 v1（热线已更新到 v2，本次调用不受影响）' with the timeline's first entry HOTLINE_VERSION_BOUND. PRODUCTION: rolled v0.4.5 -> v0.4.6 after that acceptance, per owner authorization (two multiple-choice questions, 2026-08-06: publish contracts, and roll after local acceptance). Images run 31086451876 built all three with the published-image smoke green; deployed with both compose files per the runbook; /platform/buildz and /gateway/buildz report v0.4.6 git_sha 38cc89e, and release-manifest check reports **runtime matches release v0.4.6** with the relay probed through an SSH tunnel. releases/current.yaml promoted to v0.4.6, manifest sha256 ef3922a566e6. NOT DONE, on purpose: the responder does not yet validate its output against the pinned contract and the result signature does not cover the version — that belongs with M3's delivery verification, where the check has somewhere to fail to. Client repo is untouched this round. STILL PENDING FROM CHG-2026-198: no webhook URL or liveness ping URL saved in the production console, so production remains at zero outbound alerting from an operator's point of view."
