notes: "Two exit rows were wrong about what exists, and one of them was cheap to finish. E3 said 'only the old hold-to-settle-to-refund path has evidence'. It had been out of date since the settlement-lifecycle harness landed: six flows driven end to end by a separate process against a real platform with real Postgres and billing enforced, 23/23, including the clause the exit criterion names separately \u2014 zero duplicate money events asserted by counting ledger rows per request and then actively REPLAYING the paths most likely to move money twice. Plus production: a real priced call went 980 -> 930 (the authorized ceiling held) -> 960 after acceptance, exactly the price and exactly once. Marked done. E4 said 'the content access authorization mechanism does not exist'. It shipped in v0.4.17. What it lacked was production evidence, which is now taken: reading a committed artifact from a real call was refused 403 without a reason (and the refusal named both the header and the acceptable reasons), served 200 with `delivery_verification`, and left exactly one content.accessed record carrying the byte count, the reason and the actor, with dropped_count 0. Marked done. WHAT REMAINS IS NOT ENGINEERING. E2 (three real workflows running continuously through one network) and E5 (three real technical-route decisions, two follow-on actions, one repeat use) are satisfied by the owner USING the network, not by anything that can be built for them. The PRD says so directly: the stage is complete only when the system is the preferred path for sustained real work, not when a checklist is ticked or a demo runs once. MinerU is the one of the three workflows an agent can drive; private-evidence retrieval and technical-route decisions require the owner's own questions. Manufacturing three decisions to fill the row is precisely the one-time demo the PRD excludes."
