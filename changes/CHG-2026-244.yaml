notes: "Publishing a hotline from nothing — fresh DELEXEC_HOME, the worker copied verbatim out of the publish-hotline skill, the local stack, every step exactly as documented — failed at four of them. THE SKILL'S OWN EXAMPLE DOES NOT PUBLISH: submit-review refuses it with HOTLINE_INPUT_GUIDANCE_REQUIRED because every input field needs a caller-facing description, which §2's list of what the gate refuses never mentioned. THE FIX FOR THAT DID NOT TAKE: add-hotline writes the registration draft once and reuses it forever, so a corrected worker re-registered produces the identical error from a file nobody has been told about; only remove-hotline then add-hotline worked. THE SERVICE TERMS NEVER REACHED THE PLATFORM: 0.1.22 stopped buildDefaultContractProfile writing defaults over the worker's service_tier / acceptance_window_s / execution_budget_s, but buildHotlineRegistrationDraft never copied them into the draft and buildHotlineOnboardingBody never sent them, so a worker declaring `quick` published as `standard` with a 30-minute budget and a 72-hour acceptance window nobody chose — and editing the draft by hand did not help either, though draft_meta.editable lists all three. contract-check called it in_sync throughout: it diffs six fields and service terms are not among them. AND THEN IT FAILED ON THE EPILOGUE: with the wait fixed, the same call died at CALL_HOTLINE_BALANCE_FAILED, because the balance and ledger reads ran after the result was in hand and were still fatal — a platform with billing off answers ERR_BILLING_NOT_ENABLED and a delivered, contract-verified call was reported as a failed command; they are best-effort now. CALL-HOTLINE LIED ABOUT THE OUTCOME: it waited for /controller/inbox/pull to hand it the result, which a running caller controller had already taken 250 ms earlier, so it blocked the full minute and printed a bare `timeout` on two calls the platform had recorded as delivered with delivery_integrity=verified within a second. All four client bugs are fixed with regression tests that fail without the fix, verified by stashing each fix and re-running, and then the whole path was walked a second time from a fresh DELEXEC_HOME against the local stack: the refusal reproduced, fixing the worker and re-registering was enough this time, /v2/hotlines/:id published service_tier=quick with a 300 s budget and an 86400 s acceptance window, and the call returned ok in 1.1 s with the platform recording delivered and delivery_integrity=verified against those same terms. Two findings are documented rather than fixed because they are not defects of this change: the local stack sets no BILLING_ENFORCEMENT, so a fixed-price hotline settles as none and a local run proves nothing about the paid path; and dev:local:down kills the pids of the supervisor and relay that died of EADDRINUSE at startup while leaving the real device — the one bootstrap started — orphaned on 8079/8081/8090/8091, which is exactly the collision the skill warns about. NOT DONE HERE: the ops package version is unchanged at 0.1.22 and nothing is published, so no device gets these fixes until it is; releases/current.yaml still points at the frozen v0.4.18-ops.0.1.22 combination and this client SHA is not in it."
