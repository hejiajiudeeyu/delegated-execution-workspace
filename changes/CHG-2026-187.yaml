notes: "Fourth delivery unit of M1, and the first change to consume the published @delexec/contracts 0.1.4 call-state slice (platform-api now imports ARTIFACT_ROLE, ARTIFACT_LIFECYCLE and validateArtifactDescriptor, and its dependency moved from ^0.1.3 to ^0.1.4). platform 0b776729dea2d9aecd915a7bc9c253edd2df1273 adds four routes: POST /v1/requests/:id/artifacts allocates a scoped slot for a party to the request, PUT /v1/artifacts/:id/content uploads bytes under an upload grant, POST /v1/artifacts/:id/commit binds them to a claimed checksum, and GET /v1/artifacts/:id/content serves them under a download grant or request membership. Properties pinned by 12 integration cases: a checksum mismatch is refused with CONTRACT_ARTIFACT_CHECKSUM_MISMATCH and leaves the artifact allocated so failed bytes never become delivered (NFR-R03); an upload grant cannot download and a grant for one artifact cannot touch another; a stranger to the request gets neither descriptor nor slot; committed bytes are immutable; an uncommitted artifact never serves bytes; and the committed descriptor carries no bucket, object_key, presigned_url, url or local_path, which is decision A-01 enforced rather than documented. The new @delexec/artifact-store package is the seam that keeps A-01 true: callers address bytes only by artifact id, so an S3/MinIO backend swaps in behind the same four methods without a protocol change. Its filesystem backend writes to a temporary name and renames so a crash mid-write cannot leave a half-written blob, and it rejects an artifact id that would escape the store root (two traversal cases tested). Deployment adds a durable public-stack-artifact-data volume and ARTIFACT_STORE_PATH; when unset the service warns that bytes are memory-only rather than failing silently. Honest scope note: A-01's target is S3-compatible object storage with MinIO in the official Compose; this unit lands the metadata/authorization plane plus a filesystem backend, and the object-storage backend is a follow-up slice behind the same seam. Evidence: platform unit+integration 72 passed / 2 skipped, e2e 7/7, service-packages green including the new library, deploy-config green."
