notes: "The plan's standing side item, verified before being believed and worse than the note recorded. `enforceArtifactSizeLimit` ran UNCONDITIONALLY in `finalizeTask` — before anything knew which transport would carry the result — using `EMAIL_MAX_ATTACHMENT_BYTES` (5MB default). So a run whose bytes were about to go through the artifact channel, where size is not a transport constraint and which exists for precisely this reason (CHG-2026-188/192), had its COMPLETED execution rewritten into `status: error` / `RESULT_ARTIFACT_TOO_LARGE` citing an 'email limit' — for a call that never went near email. The work was already finished; the output was destroyed at the last step by a rule that did not apply to it. Two aggravations: production runs on the relay with a platform binding, so the artifact channel was always available and the ceiling never had jurisdiction there; and email itself is FROZEN since CHG-2026-205, so a deprecated transport's limit was destroying results on the transport actually in use. The owner hits this for real — MinerU over a large paper produces well over 5MB. THE FIX: the ceiling applies only where inline is the only path there is. Decided before the result is signed (so the signature stays correct) but on the transport that will really carry it, via `canUseArtifactChannel(platform)`. Renamed to its own variable `RESPONDER_MAX_INLINE_ARTIFACT_BYTES`, with `EMAIL_MAX_ATTACHMENT_BYTES` kept as a fallback so a deployment that raised the old one keeps the number it configured; the refusal now names the constraint it hit and how to lift it (bind the responder to a platform) rather than blaming email. A NEW STATE THE OLD CEILING MADE UNREACHABLE, handled explicitly rather than discovered later: the channel was available so nothing was discarded up front, the upload then failed, and what remains will not fit in an envelope. Inlining it hands the transport something it cannot carry; dropping the attachments looks like a delivery that simply had no artifacts. Neither is true, so it is raised as the delivery failure it is (`RESULT_ARTIFACT_DELIVERY_FAILED`) into the existing failTask path. Also: an artifact upload failure now logs its REASON — `upload failed` with no cause is the same non-answer the fourth-repo integration check gave for two months, and chasing this bug needed exactly that reason to find a test-harness race. TESTS: 3 integration cases against a real platform-api — a 9MB output surviving through the channel and committed at full size, the inline-only path still refusing with an honest message, and the old environment variable still honoured. The first two are red on the previous code, the 9MB one failing with exactly the `'error'` this fixes. Client 162 unit + 131 integration. HONEST NOTE: `ops supervisor > installs the official example hotline and completes a local-only self-call` failed once during the full run and passed on re-run and in isolation; it drives a whole local stack and is timing-sensitive. Recorded as a flake, not a pass. Not released: no npm publish, no production roll — the responder change only reaches a device when it updates @delexec/ops, which is the same step the MinerU re-registration needs."
