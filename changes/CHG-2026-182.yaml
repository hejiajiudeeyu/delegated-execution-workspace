notes: "Wave 0 of the private capability network program, executed under the goal.md contract. Architecture decisions recorded at the owning layer: protocol d63317f freezes A-01 (artifact descriptors in protocol, bytes in S3-compatible storage), A-02 (authenticated relay inbox with Provider-initiated long polling), A-03 (HotlineVersion-declared recoverability so unknown RUNNING work never auto-settles or blindly re-runs), A-04 (protocol/platform state boundary), plus the canonical four-axis state model with legal transitions and the cross-axis financial matrix; it also rules on the conflicts the source PRD left open (delivered means bytes submitted not valid delivery, rejected is pre-execution and distinct from invalid, the acceptance clock starts only at verified delivery, every Call must reach a terminal state within timeout + grace). Platform cdfd46a records A-05/A-06/A-07 policy values (acceptance windows 24h/72h/7d bounded 24h-7d, one free in-scope revision reusing the original hold, per-category retention 30d/14d/180d/365d with tombstones and hold override, no commission this stage), all snapshotted into the Call at creation. Workspace ADR-002 fixes release manifest authority (workspace freezes, services only report) and ADR-003 the first-party Research boundary (independent private repo, no privileged platform path). M0 implemented: platform 6c21ca5 adds GET /buildz to platform-api, transport-relay and the console gateway reporting component/version/git sha/image digest/release id/manifest hash plus the gateway's real console asset hash, wired through Dockerfile build args and the images workflow, covered by 6 unit and 3 integration tests; the workspace adds tools/release-manifest.mjs (generate/promote/verify/probe/check) with an immutable releases/manifests/<id>.yaml, a small releases/current.yaml pointer, and a drift validator that blocks on mismatch and reports undetermined rather than passing when a service cannot state its build, covered by 16 cases in tools/release-manifest.test.mjs. The gate chain now runs test:release-manifest and release:manifest:verify before the existing checks. First manifest frozen as 2026-07-31-selfhost-baseline. Honest E0 status: repository, bundle and manifest agree, but production still runs images predating /buildz, so runtime agreement is undetermined and E0 is NOT met; a real probe of callanything.xyz returned 404/403/404 and this is recorded in the traceability ledger. FR-001..FR-084, NFR-S01..S05, NFR-R01..R06 and E0-E7 are mapped to owner/milestone/status/evidence in docs/planning/private-capability-network/traceability-ledger.md, with empty evidence forbidden from raising status above todo. Milestone child tasks created for M1-M3 with only M1 activated; M1's first delivery unit is relay authentication, not MinerU, because private evidence must not enter the unauthenticated relay. @delexec/build-info registered as boundary project platform/support. No business truth added to the fourth repository."
