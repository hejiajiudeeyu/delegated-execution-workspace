notes: "Releases CHG-2026-220 (M3 unit 1, delivery integrity). Owner pre-authorised the whole chain on 2026-08-10 after M2 was certified: push, publish contracts, lockfiles, bundle, roll production, publish ops. WHY THIS ROLL MATTERS: until production has it, the platform still settles on the responder's own account of its own work. CHG-2026-220 is only real where money actually moves. RELEASE ORDER, WHICH IS LOAD-BEARING AND WAS FOLLOWED IN THIS ORDER: @delexec/contracts 0.1.10 first (publish run 31328518840) because result-signature canonicalization is additive only in the old-signer/new-verifier direction — a responder stamping the new `hotline_version` field against a verifier that does not know it produces DIFFERENT canonical bytes, which would turn every correct delivery in production into RESULT_SIGNATURE_INVALID. Then the verifiers: platform v0.4.13 (Images run 31329067301, all four jobs green including published-image-smoke) and the caller-side client. Only then the signer: @delexec/ops 0.1.14 (publish run 31329120090), which is what a device installs. A device that does not update is not broken by this — the platform grades its deliveries `unverified` rather than `failed`, because an older responder has not delivered badly, nothing was established about it either way. VERIFIED IN PRODUCTION: `release-manifest check https://callanything.xyz` reports `runtime matches release v0.4.13` across platform-api, transport-relay and the console gateway, all three on git a0ffaeb50406. Manifest v0.4.13 frozen (sha256 4f9488a99cbe) and promoted. THE LOCKFILE TRAP, THIRD FORM: M2 was bitten twice by npm lockfiles lagging a contracts release. This time the npm lockfiles were handled and the FOURTH REPO still failed — it installs with pnpm and --frozen-lockfile, so a specifier that moved in a submodule package.json is a hard stop here until pnpm-lock.yaml moves too. Same trap, different package manager, and the four-repo integration check is the only place that catches it. ONE OPERATIONAL NOTE: the ghcr `httpReadSeeker ... EOF` transient hit again during the pull, exactly as the aliyun handover doc describes from 2026-08-09. Retrying the pull worked. Recorded a second sighting in the handover doc because it reads like a bad image and is neither — and by the time it fires the .env IMAGE_TAG has already moved, so abandoning the roll there leaves the host pointing at an image it does not have. WHAT THIS DOES NOT DO: settlement is unchanged. A delivery graded `failed` still settles exactly as before; only the record changes. The acceptance gate that makes settlement wait for a verdict is M3 unit 2. There is a test asserting that current behaviour by name so the new axis is not mistaken for enforcement. ALSO NOT DONE: the production MinerU device still runs ops 0.1.13, so no real call has yet gone through the new path end to end in production; that needs the device's supervisor updated and restarted."
