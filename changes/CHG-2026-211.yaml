notes: "M2 unit 7 (FR-070/071/072), the final plan unit, done spec-first as the plan required: the strip discipline (PRD normalization #8) landed as code shape before the routes did. THE DISCIPLINE: the ExportBundle is built as an ALLOWLIST — the contract fields a HotlineVersion freezes plus the declared availability fields — never by deleting keys from the stored record. A strip list has to be re-audited every time the record grows a field, and the field someone forgets is exactly the one that leaks; the allowlist fails closed. The audit test is the denylist half of the same guarantee: one serialized pass over the bundle bytes, every forbidden item asserted absent — credentials (api keys, admin key, the literal words secret/token), device identity (responder_id, signing public key, PEM headers), local topology (task_delivery_address, local:// URIs), contact addresses (delivery/support email — personal data the target operator has no consent to hold), and the whole quality/reputation history (queue_depth, est_exec_p95_s, review_reason/status/reviewed_by, submission_version, trust_tier, heartbeats). FR-071's reason is stated in the code: reputation was earned on the OLD network under the OLD operator's supervision, and importing it would smuggle trust across the boundary FR-072 exists to re-establish. THE DEVICE DOES NOT TRAVEL: the bundle deliberately carries no responder, so import requires naming a device the TARGET network already enrolled (IMPORT_RESPONDER_REQUIRED otherwise), takes its public key and delivery address from that device's local record, and goes through the ordinary submitCatalogHotline path — which unconditionally lands pending/disabled, so FR-072's re-approval is structural rather than a flag: the hotline is publicly invisible on the target network until its operator approves, and approval runs the full publication gate (CHG-2026-201/206) against the imported declaration on this network's terms. TAMPER: the bundle carries a declaration_digest computed by the same canonical-JSON digest a Call pins (CHG-2026-200); an edited bundle is refused at import with the mismatch named, because a digest that only warns is decoration. Existing hotline ids are not overwritten unless the operator passes overwrite:true. Both export and import are operator-credentialed and audited (hotline.exported / hotline.imported events). TESTS: platform 59 unit + 183 integration (4 new: the byte-level audit, the two-network import landing pending/disabled and invisible-then-republishable, the tampered bundle refused, the overwrite guard). All 4 red on the previous code, verified by stash. ALSO IN THIS ROUND but bundled separately: CHG-2026-210 (unit 6) and the live exit-criterion proof tools/agent-callability-e2e.mjs (24/24, fourth-repo commit 4bff438). M2 PLAN UNITS ARE NOW ALL DELIVERED (1-12; unit 3's production closeout still waits on the owner's device re-registration). NEXT: batch-end release — ops npm publish + production roll v0.4.10 (pre-authorised 2026-08-09) — then the production replay of the exit proof."
