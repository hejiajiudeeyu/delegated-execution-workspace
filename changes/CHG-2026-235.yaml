notes: "The last M3 exit gap that had no implementation at all: Wave 3 requires zero unreasoned content access, and there was no mechanism for a reason to be given or recorded. WHAT WAS TRUE BEFORE: canAccessRequestArtifacts returned true for an operator, so an operator could download any artifact's bytes with no reason asked and no trace left. Private documents are what this network exists to carry, and 'the operator could have read it and nobody would know' is not a property a private capability network can have. FR-062: an operator states a reason from a FIXED LIST (dispute_investigation, delivery_verification, abuse_report, legal_request, caller_support_request). Free text would let 'checking' stand for anything and would make the record uncountable; a list forces a category the operator would have to defend, and makes 'how many times was content opened for a dispute that never existed' a question with an answer. The refusal names both the header and the acceptable reasons rather than leaving an operator to guess. A PARTY TO THE CALL STILL READS ITS OWN DOCUMENT BY RIGHT - making a caller justify reading what it sent would be theatre, and theatre is what teaches people the reason field is a formality. FR-063: the 'not silently deletable' clause is precisely why this does not go on the general audit log. That one is pushCapped, so ordinary traffic evicts its oldest entries and a busy week would quietly erase the record of someone opening a private document. Content access gets its own log with its own far larger bound, and when it does have to drop it reports dropped_count rather than presenting a truncated list as complete - a reader learns the log is incomplete from the log. Serialized and hydrated with the rest of the state, because a log that resets with the process is not a log. Written BEFORE the bytes leave, because a record written afterwards is one a crash mid-response can lose while the reading still happened. Readable at GET /v1/admin/content-access-events, filterable by request and reason: an audit nobody can read is not an audit. TESTS: 7 new integration cases, all red without the gate. Platform 59 unit + 243 integration. WITH THIS, EVERY M3 EXIT MECHANISM EXISTS: accept, revision, auto-accept, dispute, settle and refund are covered end to end by tools/settlement-lifecycle-e2e.mjs (23/23, real Postgres, billing enforced, including a replay phase that asserts no duplicate money rows), and content access is now gated and recorded. Unreleased: production runs v0.4.16."
